<style>
/* Layout: scorebook column on phones; on tablets the scoring screen splits into board and crease on the left, keypad on the right. Players and teams are saved and picked from lists. */

<script>
/*LOGIC_START*/
const OUT_CREDIT=['Bowled','Caught','LBW','Stumped','Hit wicket'];
function fmtOvers(b){return Math.floor(b/6)+'.'+(b%6);}
function rate(runs,balls){return balls?runs*6/balls:0;}

function chipFor(ev){
  const r=ev.r||0;
  let label,cls='';
  switch(ev.k){
    case 'wd':label='Wd'+(r?'+'+r:'');cls='x';break;
    case 'nb':label='Nb'+(r?'+'+r:'');cls='x';break;
    case 'b':label='B'+r;cls='x';break;
    case 'lb':label='Lb'+r;cls='x';break;
    default:label=r===0?'•':String(r);cls=r===4?'f':r===6?'s':'';
  }
  if(ev.w){label=(ev.k==='n'&&r===0)?'W':(ev.k==='n'?label+'W':label+'+W');cls='w';}
  return {l:label,c:cls};
}

/* Replays an innings' events into the full scoring state. Undo is just removing the last event. */
function compute(M,inn,target){
  const S={runs:0,wkts:0,balls:0,extras:{wd:0,nb:0,b:0,lb:0},bat:{},bowl:{},order:[],bowlOrder:[],fow:[],log:[],
    striker:null,non:null,bowler:null,lastBowler:null,thisOver:[],overDone:false,started:false,
    done:false,reason:'',target:target==null?null:target,curOverBowlerRuns:0};
  S.nBat=teamXi(M,inn.bat);
  if(!inn.openers) return S;
  S.started=true;
  const ensureBat=i=>{if(!S.bat[i]){S.bat[i]={idx:i,runs:0,balls:0,fours:0,sixes:0,out:false,how:'',by:null,f:null};S.order.push(i);}return S.bat[i];};
  const ensureBowl=i=>{if(!S.bowl[i]){S.bowl[i]={idx:i,balls:0,runs:0,maidens:0,wkts:0,wd:0,nb:0};S.bowlOrder.push(i);}return S.bowl[i];};
  S.striker=inn.openers[0];S.non=inn.openers[1];ensureBat(S.striker);ensureBat(S.non);
  for(const ev of inn.events){
    if(ev.t==='bowler'){
      if(S.bowler!=null){
        const cl=S.log[S.log.length-1];
        S.bowler=ev.id;ensureBowl(ev.id);
        if(cl&&cl.chips.length===0) cl.bowler=ev.id;else S.split=true;
        continue;
      }
      S.split=false;
      S.bowler=ev.id;ensureBowl(ev.id);
      if(S.overDone){S.thisOver=[];S.overDone=false;}
      S.curOverBowlerRuns=0;
      S.log.push({bowler:ev.id,chips:[],runs:0,wkts:0,score:S.runs,w:S.wkts});
      continue;
    }
    if(ev.t==='swap'){const t=S.striker;S.striker=S.non;S.non=t;continue;}
    if(S.bowler==null||S.striker==null) continue;
    const k=ev.k,r=ev.r||0;
    let total=0,batRuns=0,faced=false,bowlerRuns=0,legal=true;
    switch(k){
      case 'wd':total=1+r;bowlerRuns=1+r;legal=false;S.extras.wd+=1+r;break;
      case 'nb':total=1+r;batRuns=r;faced=true;bowlerRuns=1+r;legal=false;S.extras.nb+=1;break;
      case 'b':total=r;faced=true;S.extras.b+=r;break;
      case 'lb':total=r;faced=true;S.extras.lb+=r;break;
      default:total=r;batRuns=r;faced=true;bowlerRuns=r;
    }
    const st=S.bat[S.striker],bw=S.bowl[S.bowler];
    S.runs+=total;
    if(faced) st.balls++;
    st.runs+=batRuns;
    if(batRuns===4&&(k==='n'||k==='nb')) st.fours++;
    if(batRuns===6&&(k==='n'||k==='nb')) st.sixes++;
    bw.runs+=bowlerRuns;
    if(k==='wd') bw.wd++;
    if(k==='nb') bw.nb++;
    if(legal){S.balls++;bw.balls++;}
    S.curOverBowlerRuns+=bowlerRuns;
    if(ev.w){
      const w=ev.w,ob=S.bat[w.out];
      ob.out=true;ob.how=w.how;ob.f=w.f;
      const credit=OUT_CREDIT.indexOf(w.how)>=0;
      ob.by=credit?S.bowler:null;
      if(credit) bw.wkts++;
      S.wkts++;
      S.fow.push({w:S.wkts,score:S.runs,idx:w.out,ov:fmtOvers(S.balls)});
    }
    if(r%2===1){const t=S.striker;S.striker=S.non;S.non=t;}
    if(ev.w){
      if(S.striker===ev.w.out) S.striker=ev.w.next;
      else if(S.non===ev.w.out) S.non=ev.w.next;
      if(ev.w.next!=null) ensureBat(ev.w.next);
    }
    const chip=chipFor(ev);
    S.thisOver.push(chip);
    const lg=S.log[S.log.length-1];
    lg.chips.push(chip);lg.runs+=total;if(ev.w) lg.wkts++;lg.score=S.runs;lg.w=S.wkts;
    if(legal&&S.balls%6===0){
      if(S.curOverBowlerRuns===0&&!S.split) bw.maidens++;
      const t=S.striker;S.striker=S.non;S.non=t;
      S.lastBowler=S.bowler;S.bowler=null;S.overDone=true;
    }
  }
  S.bowlOrder=S.bowlOrder.filter(i=>S.bowl[i].balls>0||S.bowl[i].runs>0||i===S.bowler);
  S.allOut=S.wkts>=S.nBat-1;
  S.oversUp=!!M.overs&&S.balls>=M.overs*6;
  S.chased=S.target!=null&&S.runs>=S.target;
  S.declared=!!inn.declared;
  S.done=S.allOut||S.oversUp||S.chased||S.declared;
  S.reason=S.chased?'Target chased':S.allOut?'All out':S.oversUp?'Overs completed':S.declared?'Innings closed early':'';
  return S;
}

function teamXi(M,t){const x=M.teams[t];return Math.min(x.xi||x.players.length,x.players.length);}
function activeOf(M,t){const x=M.teams[t];return x.active||x.players.map((_,k)=>k).slice(0,teamXi(M,t));}
function nInnings(M){return M.nInn||2;}
function teamRuns(M,A,team,upto){let r=0;for(let i=0;i<upto&&i<A.length;i++) if(M.innings[i].bat===team) r+=A[i].runs;return r;}
function targetFor(M,A,i){
  if(i!==nInnings(M)-1) return null;
  const bat=M.innings[i].bat;
  return teamRuns(M,A,1-bat,i)-teamRuns(M,A,bat,i)+1;
}
function matchOutcome(M,A){
  const n=nInnings(M),pl=(k,w)=>k+' '+w+(k===1?'':'s'),name=t=>M.teams[t].name;
  if(M.drawn) return {win:null,drawn:true,text:'Match drawn'};
  const i=A.length-1,last=A[i];
  if(!last||!last.done) return null;
  const bat=M.innings[i].bat;
  if(i===n-1){
    const opp=teamRuns(M,A,1-bat,i),own=teamRuns(M,A,bat,i)+last.runs;
    if(own>opp) return {win:bat,text:name(bat)+' won by '+pl(last.nBat-1-last.wkts,'wicket')};
    if(own===opp) return {win:null,text:'Match tied'};
    return {win:1-bat,text:name(1-bat)+' won by '+pl(opp-own,'run')};
  }
  if(n===4&&i===2){
    const o=1-bat,oRuns=teamRuns(M,A,o,3),tRuns=teamRuns(M,A,bat,3)+last.runs;
    if(tRuns<oRuns) return {win:o,text:name(o)+' won by an innings and '+pl(oRuns-tRuns,'run')};
  }
  return null;
}

    case 'hist-back':ui.hist='list';ui.top=true;break;
    case 'hist-inn':ui.histInn=+d.v;break;

    case 'sync-all':syncPush(true);return true;

    case 'export-csv':exportCsv();return true;
    default:return false;
  }
  render();
  if(a==='hist-open'&&d.v==='sync'){const el=$('syncpanel');if(el&&el.scrollIntoView)try{el.scrollIntoView();}catch(e){}}

/* ---------- live match shared between devices ----------
   The match in progress is kept in one shared record. Every device writes to it after each change and
   follows it when another device changes it. If two devices score at the same instant the later write wins. */
const DEVICE=newId('d');
let REV=0,liveT=null,liveBusy=0;
function liveDirty(){return liveT!==null||liveBusy>0;}
function liveWrite(build){
  if(LIB.mode==='local') return;
  liveBusy++;
  remote(db=>{
    const p=build();
    return (p?db.doc('live/current').set(p):Promise.resolve()).then(()=>{liveBusy=Math.max(0,liveBusy-1);},e=>{liveBusy=Math.max(0,liveBusy-1);throw e;});
  });
}
function livePush(){
  if(LIB.mode==='local') return;
  clearTimeout(liveT);
  liveT=setTimeout(()=>{liveT=null;liveWrite(()=>{if(!M) return null;REV++;return {json:JSON.stringify(M),rev:REV,by:DEVICE,at:new Date().toISOString()};});},150);
}
function liveClear(){
  clearTimeout(liveT);liveT=null;
  liveWrite(()=>{REV++;return {cleared:true,rev:REV,by:DEVICE,at:new Date().toISOString()};});
}
function liveApply(x,first){
  if(x&&x.by===DEVICE) return;
  if(liveDirty()) return;
  if(!x){if(M) livePush();return;}
  if(x.cleared){
    if(typeof x.rev==='number'&&x.rev>REV) REV=x.rev;
    if(M){M=null;clearSaved();ui=freshUi();ui.top=true;if(!first) toast('The match was ended on another device');render();}
    return;
  }
  let m=null;try{m=JSON.parse(x.json);}catch(e){}
  if(!m||m.v!==1||!m.innings||!m.teams) return;
  const had=!!M,prevCur=M?M.cur:-1;
  M=m;if(typeof x.rev==='number'&&x.rev>REV) REV=x.rev;
  if(first){try{if(matchOutcome(M,analyse())){M=null;clearSaved();if(had) render();return;}}catch(e){}}
  try{localStorage.setItem(KEY,JSON.stringify(M));}catch(e){}
  if(!had){ui=freshUi();ui.view=M.cur;ui.top=true;}
  else if(M.cur!==prevCur){ui.view=M.cur;ui.wk=null;ui.sub=null;ui.chg=false;}
  else ui.view=Math.min(ui.view,M.cur);
  render();
}
function load(){try{const s=localStorage.getItem(KEY);if(s){const m=JSON.parse(s);if(m&&m.v===1&&m.innings&&m.teams) return m;}}catch(e){}return null;}
function clearSaved(){try{localStorage.removeItem(KEY);}catch(e){}}

function clamp(n,a,b){return Math.max(a,Math.min(b,n));}

function howText(inn,b){
  if(!b.out) return 'not out';
  const bw=b.by!=null?M.teams[inn.bowl].players[b.by]:'';
  const f=(b.f!=null&&b.f!=='')?M.teams[inn.bowl].players[b.f]:'';
  switch(b.how){
    case 'Bowled':return 'b '+bw;
    case 'LBW':return 'lbw b '+bw;
    case 'Caught':return f?(+b.f===b.by?'c & b '+bw:'c '+(M.teams[inn.bowl].wk===+b.f?'†':'')+f+' b '+bw):'caught b '+bw;
    case 'Stumped':return 'st '+(f||'†')+' b '+bw;
    case 'Run out':return 'run out'+(f?' ('+f+')':'');
    case 'Hit wicket':return 'hit wicket b '+bw;
  }
  return b.how;
}

  const ids=p.sel.filter(id=>libName(id)!=null);
  if(ids.length<2){if(!quiet) toast('Pick at least 2 players');return null;}
  let ex=p.teamId?LIB.teams.find(t=>t.id===p.teamId):null;
  if(!ex) ex=LIB.teams.find(t=>t.name.toLowerCase()===name.toLowerCase());
  const id=ex?ex.id:newId('t');
  if(ex&&k!=='e'){
    /* Starting a match picks up to 16 from the saved squad, so keep the whole saved squad and only add anyone new. */
    const full=ex.playerIds.filter(i=>libName(i)!=null);
    ids.forEach(i=>{if(full.indexOf(i)<0&&full.length<52) full.push(i);});
    const cp=ids.indexOf(p.cap)>=0?p.cap:(full.indexOf(ex.capId)>=0?ex.capId:''),wp=ids.indexOf(p.wk)>=0?p.wk:(full.indexOf(ex.wkId)>=0?ex.wkId:'');

  }else libPutTeam(id,name,ids,ids.indexOf(p.cap)>=0?p.cap:'',ids.indexOf(p.wk)>=0?p.wk:'');

function startMatch(){
  const s=ui.setup;
  const test=s.fmt==='Test';
  let overs=null;
  if(!test){
    overs=parseInt(s.overs,10);
    if(!(overs>=1)){toast(s.fmt==='Custom'?'Enter the number of overs for this match':'Enter the overs per innings');return false;}
    overs=clamp(overs,1,90);
  }
  const teams=[];
  for(let k=0;k<2;k++){
    const p=s.slots[k];
    const name=normName(p.name)||('Team '+'AB'[k]);
    const ids=p.sel.filter(id=>libName(id)!=null);
    if(ids.length<2){toast(name+' needs at least 2 players');return false;}
    const xi=Math.min(11,ids.length);
    const ci=ids.indexOf(p.cap),wi=ids.indexOf(p.wk);
    teams.push({name:name,players:ids.map(libName),xi:xi,active:Array.from({length:xi},(_,k)=>k),gone:[],cap:ci>=0?ci:null,wk:wi>=0?wi:null});
  }
  if(teams[0].name.toLowerCase()===teams[1].name.toLowerCase()){toast('The two teams need different names');return false;}
  const minSize=Math.min(teams[0].xi,teams[1].xi);
  let maxPer=null;
  if(!test){
    const userMax=parseInt(s.maxper,10);
    const base=userMax>0?userMax:defaultMaxPer(s.fmt,overs);
    maxPer=Math.max(base,Math.ceil(overs/(minSize-1)));
  }
  if(s.winner===''||!s.choice){toast('Do the toss first, then choose bat or bowl');return false;}
  const winner=+s.winner,choice=s.choice;
  const bat=choice==='bat'?winner:1-winner;
  saveTeam('0',true);saveTeam('1',true);
  M={v:1,format:s.fmt,maxSubs:s.fmt==='IPL'?1:null,subsLog:[],nInn:test?4:2,overs:overs,maxPer:maxPer,teams:teams,toss:{winner:winner,choice:choice,mode:s.tossMode,caller:+s.caller,call:s.call,result:s.tossMode==='flip'?s.coin.result:null},
     innings:[{bat:bat,bowl:1-bat,openers:null,events:[],declared:false}],cur:0};
  return true;
}

function resetToss(){ui.setup.coin={state:'idle',result:''};ui.setup.winner='';ui.setup.choice='';}
/* actions on the setup and squads screens; returns true when the screen should redraw */
function actLib(a,d){
  switch(a){
    case 'screen':ui.screen=d.v;ui.top=true;return true;
    case 'preset':ui.setup.overs=String(d.v);ui.setup.fmt=d.v==='20'?'T20':d.v==='50'?'ODI':'Custom';return true;
    case 'format':{const s=ui.setup;s.fmt=d.v;s.maxper='';if(d.v==='T20'||d.v==='IPL') s.overs='20';else if(d.v==='ODI') s.overs='50';else if(d.v==='Custom') s.overs='';return true;}
    case 'add-player':addPlayerTo(d.k);return true;
    case 'pick-open':ui.pickK=d.k;return true;
    case 'pick-close':ui.pickK=null;return true;
    case 'pick-toggle':{
      const p=pk(d.k),i=p.sel.indexOf(d.id);
      if(i>=0) p.sel.splice(i,1);
      else if(otherSel(d.k).indexOf(d.id)>=0) return false;
      else if(p.sel.length>=maxSel(d.k)){toast('Up to '+maxSel(d.k)+' players can be selected here');return false;}
      else p.sel.push(d.id);
      const pl=$('plist');if(pl) pl.innerHTML=pickListHtml(d.k);
      const pc=$('pcount');if(pc) pc.textContent=p.sel.length+' of '+maxSel(d.k)+' selected';
      return false;}
    case 'save-team':saveTeam(d.k,false);return true;
    case 'clear-editor':ui.squads.editor={teamId:'',name:'',sel:[],newp:''};ui.focus='tn-e';return true;
    case 'edit-team':{const t=LIB.teams.find(x=>x.id===d.id);if(t){ui.squads.editor={teamId:t.id,name:t.name,sel:t.playerIds.filter(i=>libName(i)!=null),newp:'',cap:t.capId||'',wk:t.wkId||''};ui.focus='tn-e';}return true;}
    case 'del-player-arm':ui.armed='dp'+d.id;return true;
    case 'del-player':libDelPlayer(d.id);return true;
    case 'del-team-arm':ui.armed='dt'+d.id;return true;
    case 'del-team':libDelTeam(d.id);if(ui.squads.editor.teamId===d.id) ui.squads.editor={teamId:'',name:'',sel:[],newp:''};return true;
    case 'unpick':{const p=pk(d.k),i=p.sel.indexOf(d.id);if(i>=0) p.sel.splice(i,1);return true;}
    case 'move':{const p=pk(d.k),i=+d.i,j=i+ +d.d;if(j>=0&&j<p.sel.length){const t=p.sel[i];p.sel[i]=p.sel[j];p.sel[j]=t;}return true;}
    case 'toss-mode':ui.setup.tossMode=d.v;resetToss();return true;
    case 'toss-caller':ui.setup.caller=d.v;resetToss();return true;
    case 'toss-call':ui.setup.call=d.v;resetToss();return true;
    case 'toss-winner':ui.setup.winner=d.v;ui.setup.choice='';return true;
    case 'toss-choice':ui.setup.choice=d.v;return true;
    case 'toss-flip':{
      const s=ui.setup;if(s.coin.state==='flipping') return false;
      let bit;
      try{const arr=new Uint32Array(1);window.crypto.getRandomValues(arr);bit=arr[0]&1;}catch(e){bit=Math.random()<.5?1:0;}
      const result=bit?'tails':'heads';
      s.coin={state:'flipping',result:result};s.winner='';s.choice='';
      let ms=1500;try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) ms=250;}catch(e){}
      setTimeout(()=>{
        if(!M&&ui.setup===s&&s.coin.state==='flipping'&&s.coin.result===result){
          s.coin.state='done';s.winner=(s.call===result)?s.caller:String(1-(+s.caller));render();
        }
      },ms);
      return true;}
    case 'start':if(!startMatch()) return false;ui=freshUi();ui.top=true;save();return true;
  }
  return false;
}

/* One innings as batting and bowling tables. Used for the live scorecard and for saved matches in Match history. */
function cardPanels(d){

  return '<section class="panel"><h3>'+esc(d.bat)+' batting <em>'+d.runs+'/'+d.wkts+' ('+fmtOvers(d.balls)+' ov)</em></h3>'+
    '<div class="tbl-wrap"><table><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (d.dnb.length?'<div class="line"><b>Did not bat</b> '+d.dnb.map(esc).join(', ')+'</div>':'')+(d.subs.length?'<div class="line"><b>Substitutes</b> '+d.subs.map(esc).join(', ')+'</div>':'')+
    '<div class="line"><b>Extras '+exT+'</b> (b '+ex.b+', lb '+ex.lb+', wd '+ex.wd+', nb '+ex.nb+')</div>'+
    '<div class="line"><b>Total '+d.runs+'/'+d.wkts+'</b> in '+fmtOvers(d.balls)+' overs, run rate '+rate(d.runs,d.balls).toFixed(2)+'</div>'+
    '<div class="line"><b>Boundaries</b> '+plural(fours,'four')+', '+plural(sixes,'six')+' off the bat</div>'+
    (d.fow.length?'<div class="line"><b>Fall of wickets</b> '+d.fow.map(esc).join(', ')+'</div>':'')+'</section>'+
    '<section class="panel"><h3>'+esc(d.bowl)+' bowling <em>overs-maidens-runs-wickets</em></h3><div class="tbl-wrap"><table><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Wd</th><th>Nb</th><th>Econ</th></tr></thead><tbody>'+
    (brows||'<tr><td colspan="8" class="muted">No overs bowled yet</td></tr>')+'</tbody></table></div></section>';
}

/* ---------- match actions ---------- */
function pushBall(k,r,w){
  const S=analyse()[M.cur];
  if(!S.started||S.done||S.bowler==null) return;
  cur().events.push({t:'ball',k:k,r:r,w:w||null});
}
function act(a,d){
  if(['end-arm','new-arm','draw-arm','del-player-arm','del-team-arm','hist-del-arm','hist-del','menu'].indexOf(a)<0) ui.armed=null;
  if(a!=='copy') ui.copyText=null;
  if(histAct(a,d)) return;
  if(!M){
    const was=M;
    if(actLib(a,d)||a==='start') render();
    return;
  }
  const inn=cur();
  switch(a){
    case 'tab':ui.tab=d.v;ui.top=true;if(d.v==='card'||d.v==='overs') ui.view=Math.min(ui.view,M.innings.length-1);break;
    case 'view':ui.view=+d.v;break;
    case 'mode':ui.mode=d.v;break;
    case 'run':pushBall(ui.mode,+d.r,null);ui.mode='n';break;
    case 'wk-open':{
      const hows={n:6,wd:3,nb:1,b:1,lb:1}[ui.mode];
      ui.wk={mode:ui.mode,how:hows===1?'Run out':null,who:'s',r:0,f:'',next:null};break;}
    case 'wk-how':ui.wk.how=d.v;ui.wk.f='';break;
    case 'wk-who':ui.wk.who=d.v;break;
    case 'wk-runs':ui.wk.r=+d.v;break;
    case 'wk-cancel':ui.wk=null;break;
    case 'wk-confirm':{
      const S=analyse()[M.cur],wk=ui.wk;
      if(!wk||!wk.how) break;
      const outIdx=(wk.how==='Run out'&&wk.who==='n')?S.non:S.striker;
      const last=S.wkts+1>=S.nBat-1;
      const next=last?null:(wk.next!=null?wk.next:firstUnbatted(S,cur().bat));
      let f=(wk.f!==''&&wk.f!=null)?+wk.f:null,how=wk.how;
      if(how==='Caught & bowled'){how='Caught';f=S.bowler;}
      else if(how==='Caught behind'){
        how='Caught';
        const kp=M.teams[cur().bowl].wk;
        if(kp!=null&&activeOf(M,cur().bowl).indexOf(kp)>=0) f=kp;
      }
      pushBall(wk.mode,how==='Run out'?wk.r:0,{how:how,out:outIdx,f:f,next:next});
      ui.wk=null;ui.mode='n';break;}
    case 'undo':
      M.impactChoice=[null,null];
      if(M.drawn) M.drawn=false;
      else if(inn.declared) inn.declared=false;
      else if(inn.events.length) inn.events.pop();
      else if(inn.openers) inn.openers=null;
      ui.mode='n';ui.chg=false;break;
    case 'swap':if(analyse()[M.cur].bowler!=null) inn.events.push({t:'swap'});break;
    case 'bowler':inn.events.push({t:'bowler',id:+d.i});ui.chg=false;break;
    case 'chg-bowler':ui.chg=true;break;
    case 'chg-cancel':ui.chg=false;break;
    case 'start-inn':{
      const s=+$('sel-s').value,n=+$('sel-n').value,b=+$('sel-b').value;
      if(s===n){toast('Pick two different batters');return;}
      inn.openers=[s,n];inn.events.push({t:'bowler',id:b});break;}
    case 'next-inn':
      if(M.format==='IPL'&&M.cur===0&&!(impactStatus(0)&&impactStatus(1))) break;
      goNextInnings();break;
    case 'sub-open':ui.sub={team:inn.bat,out:'',in:''};break;
    case 'sub-team':ui.sub.team=+d.v;ui.sub.out='';ui.sub.in='';break;
    case 'sub-cancel':ui.sub=null;break;
    case 'sub-confirm':{
      const sub=ui.sub;if(!sub||sub.out===''||sub.in==='') break;
      const tm=M.teams[sub.team];
      if(M.maxSubs!=null&&(M.subsLog||[]).filter(x=>x.team===sub.team).length>=M.maxSubs) break;
      if(!tm.active) tm.active=activeOf(M,sub.team);
      tm.gone=tm.gone||[];
      const pos=tm.active.indexOf(sub.out);if(pos<0) break;
      tm.active[pos]=sub.in;tm.gone.push(sub.out);
      M.subsLog=M.subsLog||[];M.subsLog.push({team:sub.team,out:sub.out,in:sub.in,inn:M.cur,balls:analyse()[M.cur].balls});
      toast(tm.players[sub.in]+' replaces '+tm.players[sub.out]);
      const brk=sub.brk;ui.sub=null;if(brk) maybeAdvance();break;}
    case 'impact-open':ui.sub={team:+d.t,out:'',in:'',lock:true,brk:true};break;
    case 'impact-none':M.impactChoice=M.impactChoice||[null,null];M.impactChoice[+d.t]='none';maybeAdvance();break;
    case 'impact-change':M.impactChoice=M.impactChoice||[null,null];M.impactChoice[+d.t]=null;break;
    case 'impact-undo':{
      const L=M.subsLog||[];let ix=-1;
      for(let k=L.length-1;k>=0;k--) if(L[k].team===+d.t){ix=k;break;}
      if(ix>=0){const e=L.splice(ix,1)[0],tm=M.teams[e.team],pos=tm.active.indexOf(e['in']);if(pos>=0) tm.active[pos]=e.out;tm.gone=(tm.gone||[]).filter(x=>x!==e.out);}
      break;}
    case 'sub-undo':{
      const e=(M.subsLog||[]).pop();if(!e) break;
      const tm=M.teams[e.team],pos=tm.active.indexOf(e['in']);
      if(pos>=0) tm.active[pos]=e.out;
      tm.gone=(tm.gone||[]).filter(x=>x!==e.out);
      ui.sub={team:e.team,out:'',in:''};break;}
    case 'draw-arm':ui.armed='draw';break;
    case 'draw-confirm':M.drawn=true;break;
    case 'back-inn':
      if(M.cur>0&&!M.innings[M.cur].events.length&&!M.innings[M.cur].openers){M.innings.pop();M.cur--;ui.view=M.cur;}break;
    case 'end-arm':ui.armed='end';break;
    case 'end-confirm':inn.declared=true;break;
    case 'new-arm':ui.armed='new';break;
    case 'new-confirm':if(!M.recKey&&M.innings.some(x=>x.events.length)) histRecord(true);clearSaved();M=null;liveClear();ui=freshUi();ui.top=true;render();return;
    case 'copy':{
      const text=summaryText(analyse());
      const fallback=()=>{ui.copyText=text;render();};
      try{navigator.clipboard.writeText(text).then(()=>toast('Summary copied'),fallback);}catch(e){fallback();}
      return;}
  }
  {const r=matchOutcome(M,analyse());if(r){const k=r.text;if(M.recKey!==k){M.recKey=k;histRecord(false);}}}
  save();render();
}

function render(){
  const ae=document.activeElement;
  const fid=(ae&&ae.id&&$('app').contains(ae))?ae.id:null;
  let ss=null,se=null;
  try{ss=ae.selectionStart;se=ae.selectionEnd;}catch(e){}
  const sy=window.scrollY;
  $('app').innerHTML=(ui.hist?histHtml():M?renderMatch():renderSetup())+((!M&&!ui.hist&&ui.pickK!=null)?pickModal():'');
  const want=ui.focus||fid;
  if(want){
    const el=$(want);
    if(el){
      try{el.focus({preventScroll:true});}catch(e){}
      if(want===fid&&!ui.focus&&ss!=null){try{el.setSelectionRange(ss,se);}catch(e){}}
    }
  }
  ui.focus=null;
  window.scrollTo(0,ui.top?0:sy);ui.top=false;
  const cb=$('copybox');if(cb){cb.focus();cb.select();}
}

document.addEventListener('click',e=>{
  if(ui.menu&&!e.target.closest('.menuwrap')){ui.menu=false;if(!e.target.closest('[data-act]')){render();return;}}
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled) return;
  if(el.dataset.act==='wk-cancel-bg'){if(e.target===el){ui.wk=null;render();}return;}
  if(el.dataset.act==='pick-close-bg'){if(e.target===el){ui.pickK=null;render();}return;}
  if(el.dataset.act==='sub-cancel-bg'){if(e.target===el){ui.sub=null;render();}return;}
  act(el.dataset.act,el.dataset);
});
function updateToss(){document.querySelectorAll('[data-tn]').forEach(el=>{el.textContent=tn(+el.dataset.tn);});}
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.f==='sync'){SYNC.url=e.target.value.trim();persistSync();return;}
  if(M) return;

  if(d.s){ui.setup[d.s]=t.value;return;}
  if(d.f==='name'){pk(d.k).name=t.value;updateToss();}
  else if(d.f==='newp'){if(d.k==='lib') ui.squads.newp=t.value;else pk(d.k).newp=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(!M){
    if(d.s){ui.setup[d.s]=t.value;if(d.s==='overs'){const f=ui.setup.fmt;if(f!=='Custom'){ui.setup.fmt=((f==='IPL'||f==='T20')&&t.value==='20')?f:t.value==='20'?'T20':t.value==='50'?'ODI':'Custom';}render();}return;}
    if(d.f==='team'){pickTeam(d.k,t.value);render();}
    else if(d.f==='cap'||d.f==='wkp'){const p=pk(d.k);if(d.f==='cap') p.cap=t.value;else p.wk=t.value;}
    else if(d.f==='tick'){
      const p=pk(d.k),i=p.sel.indexOf(d.id);
      if(t.checked&&i<0&&otherSel(d.k).indexOf(d.id)<0){if(p.sel.length>=maxSel(d.k)) toast('Up to '+maxSel(d.k)+' players can be selected here');else p.sel.push(d.id);}
      else if(!t.checked&&i>=0) p.sel.splice(i,1);
      render();
    }else if(d.f==='rename'){
      const name=normName(t.value),cur=LIB.players.find(p=>p.id===d.id);
      if(cur&&name&&name!==cur.name){
        if(LIB.players.some(p=>p.id!==d.id&&p.name.toLowerCase()===name.toLowerCase())) toast(name+' is already saved');
        else libPutPlayer(d.id,name);
      }
      render();
    }
    return;
  }
  if(d.bind&&ui.wk){ui.wk[d.bind]=t.value===''?'':+t.value;}
  if(d.subbind&&ui.sub){ui.sub[d.subbind]=t.value===''?'':+t.value;render();}
});
document.addEventListener('keydown',e=>{
  const t=e.target,d=t.dataset||{};
  if(!M&&e.key==='Escape'&&ui.pickK!=null){ui.pickK=null;render();return;}
  if(!M&&d.f==='newp'&&e.key==='Enter'){e.preventDefault();act('add-player',{k:d.k});return;}
  if(!M||e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=(t.tagName||'').toLowerCase();
  if(e.key==='Escape'&&(ui.wk||ui.sub)){ui.wk=null;ui.sub=null;render();return;}
  if(tag==='input'||tag==='textarea'||tag==='select'||ui.wk||ui.sub||ui.tab!=='score') return;
  const S=analyse()[M.cur];
  if(!S.started||S.done) return;
  if(/^[0-6]$/.test(e.key)&&S.bowler!=null){
    const allow={n:[0,1,2,3,4,5,6],wd:[0,1,2,3,4],nb:[0,1,2,3,4,5,6],b:[1,2,3,4],lb:[1,2,3,4]}[ui.mode];
    if(allow.indexOf(+e.key)>=0) act('run',{r:e.key});
  }else if(e.key==='w'&&S.bowler!=null) act('wk-open',{});
  else if(e.key==='u') act('undo',{});
});

loadLib();loadHist();
M=load();
/* A finished match is not reopened: it is kept in Match history and the app opens normally. Only a half-scored match is resumed. */
if(M){try{if(matchOutcome(M,analyse())){if(!M.recKey) histRecord(false);clearSaved();M=null;}}catch(e){}}
/* A half-scored match is only reopened when everything entered so far had reached the spreadsheet. */
if(M){let ok=false;try{ok=!!SYNC.url&&localStorage.getItem(SYNCEDKEY)===sigHash(buildSync().sig);}catch(e){}if(!ok) M=null;}
if(M) ui.view=M.cur;
render();
initDb();
</script>
