<style>
/* Layout: scorebook column on phones; on tablets the scoring screen splits into board and crease on the left, keypad on the right. Players and teams are saved and picked from lists. */
:root{
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;

  --surface2:#D2F0EE;
  --ink:#0B2625;
  --muted:#34585A;
  --line:#6BC1BD;
  --accent:#0A605B;
  --accent-ink:#FFFFFF;
  --board:#0B3836;
  --board-ink:#EFFAF8;
  --board-muted:#9FCFCA;
  --board-line:#26605C;
  --wicket:#B3261E;
  --wicket-ink:#FFFFFF;
  --four:#1F5F8F;
  --six:#A15F00;
  --extra:#5A6878;
  --scrim:rgba(10,18,13,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{

button,input,select,textarea{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.stack{max-width:760px;margin:0 auto}

.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}

.over{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 14px 12px;min-height:50px}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:2px 12px 12px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}

.namebar{display:flex;gap:8px}
.namebar input{flex:1;min-width:0}
.arrowbtn{flex:none;width:48px;padding:0;display:grid;place-items:center}
.searchbox{margin:12px 0 8px}
.plist{display:grid;gap:6px;max-height:52vh;overflow:auto}
.psrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.psrow .pn{flex:1 1 150px;min-width:0;font-weight:600;overflow-wrap:anywhere}

  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* Toss */
.batwrap{perspective:700px;display:grid;place-items:center;padding:18px 0 10px;min-height:150px}

.batflip .rivers{transform:rotateX(180deg)}

@keyframes flipH{0%{transform:translateY(0) rotateX(0deg)}45%{transform:translateY(-44px) rotateX(900deg)}100%{transform:translateY(0) rotateX(1800deg)}}
@keyframes flipT{0%{transform:translateY(0) rotateX(0deg)}45%{transform:translateY(-44px) rotateX(900deg)}100%{transform:translateY(0) rotateX(1980deg)}}

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/*LOGIC_START*/
const OUT_CREDIT=['Bowled','Caught','LBW','Stumped','Hit wicket','Hit furniture','Six and out'];
const CUSTOM_HOWS=['Hit furniture','Six and out','Hit the ball twice','Obstructing the field','Handled the ball'];
function fmtOvers(b){return Math.floor(b/6)+'.'+(b%6);}
function rate(runs,balls){return balls?runs*6/balls:0;}

function chipFor(ev){
  const r=ev.r||0;
  let label,cls='';
  switch(ev.k){
    case 'wd':label='Wd'+(r?'+'+r:'');cls='x';break;
    case 'nb':label='Nb'+(r?'+'+r:'');cls='x';break;
    case 'b':label='B'+r;cls='x';break;
    case 'lb':label='Lb'+r;cls='x';break;
    default:label=r===0?'•':String(r);cls=r===4?'f':r===6?'s':'';
  }
  if(ev.w){label=(ev.k==='n'&&r===0)?'W':(ev.k==='n'?label+'W':label+'+W');cls='w';}
  return {l:label,c:cls};
}

/* Replays an innings' events into the full scoring state. Undo is just removing the last event. */
function compute(M,inn,target){
  const S={runs:0,wkts:0,balls:0,extras:{wd:0,nb:0,b:0,lb:0},bat:{},bowl:{},order:[],bowlOrder:[],fow:[],log:[],
    striker:null,non:null,bowler:null,lastBowler:null,thisOver:[],overDone:false,started:false,
    done:false,reason:'',target:target==null?null:target,curOverBowlerRuns:0};
  S.nBat=teamXi(M,inn.bat);
  S.maxW=inn.so?Math.min(2,S.nBat-1):S.nBat-1;
  if(!inn.openers) return S;
  S.started=true;
  const ensureBat=i=>{if(!S.bat[i]){S.bat[i]={idx:i,runs:0,balls:0,fours:0,sixes:0,out:false,how:'',by:null,f:null};S.order.push(i);}return S.bat[i];};
  const ensureBowl=i=>{if(!S.bowl[i]){S.bowl[i]={idx:i,balls:0,runs:0,maidens:0,wkts:0,wd:0,nb:0};S.bowlOrder.push(i);}return S.bowl[i];};
  S.striker=inn.openers[0];S.non=inn.openers[1];ensureBat(S.striker);ensureBat(S.non);
  for(const ev of inn.events){
    if(ev.t==='bowler'){
      if(S.bowler!=null){
        const cl=S.log[S.log.length-1];
        S.bowler=ev.id;ensureBowl(ev.id);
        if(cl&&cl.chips.length===0) cl.bowler=ev.id;else S.split=true;
        continue;
      }
      S.split=false;
      S.bowler=ev.id;ensureBowl(ev.id);
      if(S.overDone){S.thisOver=[];S.overDone=false;}
      S.curOverBowlerRuns=0;
      S.log.push({bowler:ev.id,chips:[],runs:0,wkts:0,score:S.runs,w:S.wkts});
      continue;
    }
    if(ev.t==='swap'){const t=S.striker;S.striker=S.non;S.non=t;continue;}
    if(S.bowler==null||S.striker==null) continue;
    const k=ev.k,r=ev.r||0;
    let total=0,batRuns=0,faced=false,bowlerRuns=0,legal=true;
    switch(k){
      case 'wd':total=1+r;bowlerRuns=1+r;legal=false;S.extras.wd+=1+r;break;
      case 'nb':total=1+r;batRuns=r;faced=true;bowlerRuns=1+r;legal=false;S.extras.nb+=1;break;
      case 'b':total=r;faced=true;S.extras.b+=r;break;
      case 'lb':total=r;faced=true;S.extras.lb+=r;break;
      default:total=r;batRuns=r;faced=true;bowlerRuns=r;
    }
    const st=S.bat[S.striker],bw=S.bowl[S.bowler];
    S.runs+=total;
    if(faced) st.balls++;
    st.runs+=batRuns;
    if(batRuns===4&&(k==='n'||k==='nb')) st.fours++;
    if(batRuns===6&&(k==='n'||k==='nb')) st.sixes++;
    bw.runs+=bowlerRuns;
    if(k==='wd') bw.wd++;
    if(k==='nb') bw.nb++;
    if(legal){S.balls++;bw.balls++;}
    S.curOverBowlerRuns+=bowlerRuns;
    if(ev.w){
      const w=ev.w,ob=S.bat[w.out];
      ob.out=true;ob.how=w.how;ob.f=w.f;
      const credit=OUT_CREDIT.indexOf(w.how)>=0;
      ob.by=credit?S.bowler:null;
      if(credit) bw.wkts++;
      S.wkts++;
      S.fow.push({w:S.wkts,score:S.runs,idx:w.out,ov:fmtOvers(S.balls)});
    }
    if(r%2===1){const t=S.striker;S.striker=S.non;S.non=t;}
    if(ev.w){
      if(S.striker===ev.w.out) S.striker=ev.w.next;
      else if(S.non===ev.w.out) S.non=ev.w.next;
      if(ev.w.next!=null) ensureBat(ev.w.next);
    }
    const chip=chipFor(ev);
    S.thisOver.push(chip);
    const lg=S.log[S.log.length-1];
    lg.chips.push(chip);lg.runs+=total;if(ev.w) lg.wkts++;lg.score=S.runs;lg.w=S.wkts;
    if(legal&&S.balls%6===0){
      if(S.curOverBowlerRuns===0&&!S.split) bw.maidens++;
      const t=S.striker;S.striker=S.non;S.non=t;
      S.lastBowler=S.bowler;S.bowler=null;S.overDone=true;
    }
  }
  S.bowlOrder=S.bowlOrder.filter(i=>S.bowl[i].balls>0||S.bowl[i].runs>0||i===S.bowler);
  S.allOut=S.wkts>=S.maxW;
  S.oversUp=!!ovLimit(M,inn)&&S.balls>=ovLimit(M,inn)*6;
  S.chased=S.target!=null&&S.runs>=S.target;
  S.declared=!!inn.declared;
  S.done=S.allOut||S.oversUp||S.chased||S.declared;
  S.reason=S.chased?'Target chased':S.allOut?'All out':S.oversUp?'Overs completed':S.declared?(M.overs?'Innings closed early':'Innings declared'):'';
  return S;
}

function teamXi(M,t){const x=M.teams[t];return Math.min(x.xi||x.players.length,x.players.length);}
function activeOf(M,t){const x=M.teams[t];return x.active||x.players.map((_,k)=>k).slice(0,teamXi(M,t));}
function nInnings(M){return (M.nInn||2)+2*(M.sos||0);}
/* Limited-overs matches that finish level go to a Super Over: one over each, two wickets each, at most two. Tests never do. */
function ovLimit(M,inn){return inn&&inn.so?1:M.overs;}
function superNeeded(M,A){
  if(!M.overs||M.drawn) return 0;
  const i=A.length-1;
  if(i<1||i%2===0||A.length!==M.innings.length) return 0;
  if(!A[i].done||A[i].runs!==A[i-1].runs) return 0;
  const p=(i-1)/2;
  return p<2?p+1:0;
}
function teamRuns(M,A,team,upto){let r=0;for(let i=0;i<upto&&i<A.length;i++) if(M.innings[i].bat===team) r+=A[i].runs;return r;}
function targetFor(M,A,i){
  if(M.overs){return i%2===1?A[i-1].runs+1:null;}
  if(i!==nInnings(M)-1) return null;
  const bat=M.innings[i].bat;
  return teamRuns(M,A,1-bat,i)-teamRuns(M,A,bat,i)+1;
}
function matchOutcome(M,A){
  const n=nInnings(M),pl=(k,w)=>k+' '+w+(k===1?'':'s'),name=t=>M.teams[t].name;
  if(M.drawn) return {win:null,drawn:true,text:'Match drawn'};
  const i=A.length-1,last=A[i];
  if(!last||!last.done) return null;
  const bat=M.innings[i].bat;
  if(M.overs){
    if(i%2===0) return null;
    const p=(i-1)/2,opp=A[i-1].runs,own=last.runs,so=p===0?'':p===1?' in the Super Over':' in the 2nd Super Over';
    if(own>opp) return {win:bat,text:p===0?name(bat)+' won by '+pl(last.nBat-1-last.wkts,'wicket'):name(bat)+' won'+so};
    if(own<opp) return {win:1-bat,text:p===0?name(1-bat)+' won by '+pl(opp-own,'run'):name(1-bat)+' won'+so};
    return p>=2?{win:null,text:'Match tied after 2 Super Overs'}:null;
  }
  if(i===n-1){
    const opp=teamRuns(M,A,1-bat,i),own=teamRuns(M,A,bat,i)+last.runs;
    if(own>opp) return {win:bat,text:name(bat)+' won by '+pl(last.nBat-1-last.wkts,'wicket')};
    if(own===opp) return {win:null,text:'Match tied'};
    return {win:1-bat,text:name(1-bat)+' won by '+pl(opp-own,'run')};
  }
  if(n===4&&i===2){
    const o=1-bat,oRuns=teamRuns(M,A,o,3),tRuns=teamRuns(M,A,bat,3)+last.runs;
    if(tRuns<oRuns) return {win:o,text:name(o)+' won by an innings and '+pl(oRuns-tRuns,'run')};
  }
  return null;
}

function cmpS(a,b){return a<b?-1:a>b?1:0;}
function canon(v){
  if(v===null||v===undefined) return 'null';
  if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
  if(typeof v==='object') return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';

}
function mergeRecs(a,b,pre){

function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* Every change updates the local copy at once, then is written to the shared store in order. */
function remote(op){
  if(DB) chain=chain.then(()=>op(DB)).catch(()=>{toast('Could not save. You may have view-only access to this page.');});
  else if(LIB.mode==='loading') pendingOps.push(op);
}
function libPutPlayer(id,name){
  const i=LIB.players.findIndex(p=>p.id===id);
  const u=nowIso();if(i>=0){LIB.players[i].name=name;LIB.players[i].u=u;}else LIB.players.push({id:id,name:name,u:u});
  LIB.players.sort(byName);persistLib();syncSoon();
  remote(db=>db.doc('players/'+id).set({name:name}));
}
function libDelPlayer(id){
  LIB.players=LIB.players.filter(p=>p.id!==id);tomb('p:'+id);
  LIB.teams.forEach(t=>{
    if(t.playerIds.indexOf(id)>=0){t.u=nowIso();t.playerIds=t.playerIds.filter(x=>x!==id);if(t.capId===id) t.capId='';if(t.wkId===id) t.wkId='';const ids=t.playerIds.slice(),nm=t.name,tid=t.id,cp=t.capId||'',wp=t.wkId||'';remote(db=>db.doc('teams/'+tid).set({name:nm,playerIds:ids,capId:cp,wkId:wp}));}
  });

  if(ui.squads&&ui.squads.editor&&ui.squads.editor.sel) ui.squads.editor.sel=ui.squads.editor.sel.filter(x=>x!==id);
  if(ui.setup&&ui.setup.slots) ui.setup.slots.forEach(sl=>{sl.sel=sl.sel.filter(x=>x!==id);if(sl.cap===id) sl.cap='';if(sl.wk===id) sl.wk='';});

}

async function initDb(){
  let db=null;
  try{if(window.claude&&window.claude.use) db=await window.claude.use('db');}catch(e){db=null;}
  if(!db){LIB.mode='local';pendingOps=[];libChanged();return;}
  DB=db;LIB.mode='db';
  const ops=pendingOps;pendingOps=[];
  for(const op of ops){try{await op(db);}catch(e){toast('Could not save. You may have view-only access to this page.');}}
  const sub=(kind,apply)=>{
    db.collection(kind).onSnapshot(snap=>{
      if(snap.empty&&snap.metadata.fromCache&&!snap.metadata.hasPendingWrites) return;
      apply(snap.docs);LIB.players.sort(byName);LIB.teams.sort(byName);persistLib();libChanged();
    },()=>{});
  };
  sub('players',docs=>{LIB.players=docs.map(d=>({id:d.id,name:String((d.data()||{}).name||'')})).filter(p=>p.name);});
  sub('teams',docs=>{LIB.teams=docs.map(d=>{const x=d.data()||{};return {id:d.id,name:String(x.name||''),playerIds:Array.isArray(x.playerIds)?uniq(x.playerIds):[],capId:typeof x.capId==='string'?x.capId:'',wkId:typeof x.wkId==='string'?x.wkId:''};}).filter(t=>t.name);});
  {let liveFirst=true;
   db.collection('live').onSnapshot(snap=>{
     if(snap.empty&&snap.metadata.fromCache&&!snap.metadata.hasPendingWrites) return;
     const d=snap.docs.find(x=>x.id==='current');
     const first=liveFirst;liveFirst=false;
     try{liveApply(d?(d.data()||{}):null,first);}catch(e){}
   },()=>{});}
  db.collection('tournaments').onSnapshot(snap=>{
    if(snap.empty&&snap.metadata.fromCache&&!snap.metadata.hasPendingWrites) return;
    TOURS=snap.docs.map(d=>{try{return JSON.parse((d.data()||{}).json);}catch(e){return null;}}).filter(t=>t&&t.id&&Array.isArray(t.teams)&&Array.isArray(t.fixtures));
    persistTours();libChanged();
  },()=>{});
  sub('matches',docs=>{HIST=docs.map(d=>Object.assign({},d.data()||{},{id:d.id})).filter(r=>r.t1);HIST.sort((a,b)=>String(b.at).localeCompare(String(a.at)));persistHist();});
  libChanged();
}

function mergeSheetLib(d){
  if(!d||d.ok===false) return 0;
  let n=0;
  const byName=nm=>LIB.players.find(p=>p.name.toLowerCase()===String(nm).toLowerCase());
  const ensure=(nm,wantId)=>{
    let p=byName(nm);
    if(!p){
      if(wantId&&DEL['p:'+String(wantId)]) return '';
      const id=wantId&&!LIB.players.some(x=>x.id===String(wantId))?String(wantId):newId('p');
      libPutPlayer(id,nm);p={id:id,name:nm};n++;
    }
    return p.id;
  };
  (d.players||[]).forEach(r=>{const nm=normName(r&&r[1]);if(nm) ensure(nm,r[0]);});
  (d.teams||[]).forEach(r=>{
    const name=normName(r&&r[1]);if(!name) return;
    const names=String(r[2]||'').split(',').map(normName).filter(Boolean);
    let ids;
    const idList=String(r[5]||'').split(',').map(s=>s.trim()).filter(Boolean);
    const idNames=idList.map(libName);
    if(idList.length&&idNames.every(Boolean)&&idNames.join(', ').toLowerCase()===names.join(', ').toLowerCase()) ids=uniq(idList);
    else ids=uniq(names.map(nm=>{const p=byName(nm);return p?p.id:'';}).filter(Boolean));
    const capName=normName(r[3]),wkName=normName(r[4]);
    const cap=capName&&byName(capName)?byName(capName).id:'',wk=wkName&&byName(wkName)?byName(wkName).id:'';
    const t=LIB.teams.find(x=>x.id===String(r[0])||x.name.toLowerCase()===name.toLowerCase());
    if(!t){
      if(r[0]&&DEL['t:'+String(r[0])]) return;
      const id=r[0]&&!LIB.teams.some(x=>x.id===String(r[0]))?String(r[0]):newId('t');
      libPutTeam(id,name,ids.slice(0,55),cap,wk);n++;
    }else{
      const add=ids.filter(i=>t.playerIds.indexOf(i)<0);
      if(add.length){libPutTeam(t.id,t.name,t.playerIds.concat(add).slice(0,55),t.capId||cap,t.wkId||wk);n++;}
    }
  });
  return n;
}

function applyState(st){

  const beforeAll=canon(coreObj());
  APPLYING=true;
  try{
    Object.keys(st.del||{}).forEach(k=>{if(String(st.del[k])>String(DEL[k]||'')) DEL[k]=st.del[k];});
    persistDel();
    const lib=st.lib||{};
    LIB.players=mergeRecs(LIB.players,lib.players,'p:').filter(p=>p.name);
    LIB.teams=mergeRecs(LIB.teams,lib.teams,'t:');
    LIB.teams.forEach(t=>{t.playerIds=uniq(Array.isArray(t.playerIds)?t.playerIds:[]);});
    LIB.players.sort(byName);LIB.teams.sort(byName);persistLib();
    HIST=mergeRecs(HIST,st.hist,'m:').filter(r=>r.t1);
    HIST.sort((a,b)=>String(b.at).localeCompare(String(a.at)));persistHist();
    TOURS=mergeRecs(TOURS,st.tours,'o:').filter(t=>Array.isArray(t.teams)&&Array.isArray(t.fixtures));persistTours();
    /* The match being scored is one shared record: the newest change wins. */
    const rAt=String(st.liveAt!==undefined?st.liveAt:(st.at||''));
    if(rAt>LIVEAT){
      const had=!!M,beforeM=had?JSON.stringify(M):'';
      const L=st.live&&st.live.v===1&&st.live.innings&&st.live.teams?st.live:null;
      if(M){
        if(!L){if(!first){M=null;clearSaved();ui=freshUi();ui.top=true;}}
        else if(sameMatch(M,L)&&!(first&&String(M.savedAt||'')>String(L.savedAt||''))){
          M=L;try{localStorage.setItem(KEY,JSON.stringify(M));}catch(e){}
          ui.view=Math.min(ui.view,M.innings.length-1);if(JSON.stringify(M)!==beforeM){ui.wk=null;ui.sub=null;}
        }
        if(M) PENDING=null;

    }
    if(st.at&&String(st.at)>String(STATEAT)){STATEAT=st.at;try{localStorage.setItem(STATEKEY,STATEAT);}catch(e){}}
  }finally{APPLYING=false;}
  if(canon(coreObj())!==beforeAll){render();toast('Updated with the latest from the sheet or another device');}
  /* Anything this device has that the sheet does not is sent straight back, so nothing is lost. */
  syncSoon();

function pullState(force){
  if(LIB.mode==='loading') return new Promise(r=>setTimeout(r,300)).then(()=>pullState(force));
  if(LIB.mode!=='local'||!SYNC.url||pulling) return Promise.resolve(false);
  if(!force&&(SYNC.ready===false||SYNC.state==='syncing'||syncT!==null)) return Promise.resolve(false);
  pulling=true;
  /* The regular check only asks when the shared data last changed, which is tiny. The full data is fetched only when it changed and the change did not come from this device. */
  const quick=force?Promise.resolve(true):sheetStatus('stateat').then(q=>{
    if(!(q&&q.ok!==false&&typeof q.stateAt==='string'&&q.stateAt!=='')) return false;
    if(q.stateAt===SEENAT) return false;
    if(q.stateBy&&q.stateBy===DEVICE){SEENAT=q.stateAt;return false;}
    return true;
  });
  return quick.then(need=>need?sheetStatus('state'):null).then(d=>{
    pulling=false;
    if(d===null) return false;
    if(d&&d.ok!==false&&d.state==='') return 'none';
    if(!d||d.ok===false||!d.state) return false;
    let st=null;try{st=JSON.parse(d.state);}catch(e){}
    if(!st) return false;
    SEENAT=d.stateAt||'';
    applyState(st);return true;
  }).catch(()=>{pulling=false;return false;});
}

function syncBoth(){
  if(!SYNC.url) return Promise.resolve('Paste the Sync URL first.');
  return pullState(true).then(r=>importLib().then(()=>r)).then(r=>{
    if(r===false&&!SYNC.url) return null;
    return syncPush(true);

    if(!c||c.ok===false||!c.sheet) return 'Could not read the sheet to compare. Check the connection and that the latest Code.gs is deployed.';
    const app={players:LIB.players.length,teams:LIB.teams.length,matches:HIST.length,tournaments:TOURS.length};
    const names={players:'players',teams:'teams',matches:'matches',tournaments:'tournaments'};
    const line=o=>Object.keys(names).map(k=>(o[k]==null?'?':o[k])+' '+names[k]).join(', ');
    const diff=Object.keys(names).filter(k=>c.sheet[k]!==app[k]);

    if(st.lastSync===b.sentAt||(st.recent||[]).indexOf(b.sentAt)>=0) return {r:'ok',st:st};

  if(!SYNC.url||SYNC.ready===false) return Promise.resolve();
  let u;try{u=new URL(SYNC.url);if(u.protocol!=='https:'&&u.protocol!=='http:') throw 0;}catch(e){syncTry=4;syncFail('That Sync URL does not look like a web address.');return Promise.resolve();}
  if(/\/dev\/?$/.test(u.pathname)){syncTry=4;syncFail('That Sync URL ends in /dev. Use the web app URL that ends in /exec.');return Promise.resolve();}
  /* Send one copy at a time, so an older copy can never reach the sheet after a newer one. A change made meanwhile is sent right after. */
  if(!leaving&&SYNC.busy&&Date.now()<SYNC.busy){SYNC.again=true;return Promise.resolve();}
  let b;try{b=buildSync();}catch(e){syncFail('Could not prepare the data to send ('+(e&&e.message?e.message:'error')+').');return Promise.resolve();}
  const my=++syncSeq;
  setSync('syncing');
  if(!leaving) SYNC.busy=Date.now()+30000;
  const release=()=>{if(leaving) return;SYNC.busy=0;if(SYNC.again){SYNC.again=false;setTimeout(()=>syncPush(true),30);}};
  const opts={method:'POST',mode:'no-cors',redirect:'follow',credentials:'omit',referrerPolicy:'no-referrer',headers:{'Content-Type':'text/plain;charset=utf-8'},body:b.body};
  /* keepalive is only worth it while the page is closing, and it has a small size limit. */
  if(leaving&&b.body.length<60000) opts.keepalive=true;
  const beacon=()=>{
    try{if(navigator.sendBeacon&&b.body.length<60000&&navigator.sendBeacon(u.href,new Blob([b.body],{type:'text/plain;charset=utf-8'}))) return true;}catch(e){}
    return false;
  };
  const failed=()=>{
    if(my!==syncSeq) return;
    if(leaving&&beacon()) return;
    syncFail('Could not reach the Sync URL. Check your internet connection and that the web app is deployed with access set to Anyone. It will try again on its own.');
  };
  let p;try{p=fetch(u.href,opts);}catch(e){failed();release();return Promise.resolve();}
  if(leaving) return p.then(()=>{if(my!==syncSeq) return;syncDone(b);},failed);
  return p.then(()=>{
    if(my!==syncSeq) return;
    return verifySent(b,0).then(v=>{
      if(my!==syncSeq) return;
      if(v.r==='ok'){SYNC.miss=0;syncDone(b,'and confirmed by your sheet.');}
      else if(v.r==='newer'){syncDone(b,'(another device has newer data, so it is being loaded here).');pullState();}
      else if(v.r==='unreadable') syncDone(b,'(sent, but this page could not read the sheet script\'s reply, so check your sheet).');
      else if(v.r==='problem') syncFail('The script could not open your spreadsheet: '+v.msg);
      else if(!SYNC.miss){SYNC.miss=1;SYNC.again=true;}
      else{SYNC.miss=0;syncDone(b,'(sent, but the sheet script did not confirm it yet. If the sheet is empty, redeploy Code.gs with Deploy > Manage deployments > Edit > New version, "Execute as: Me", "Who has access: Anyone").');}
    });
  },failed).then(release,release);
}

/* ---------- live match shared between devices ----------
   The match in progress is kept in one shared record. Every device writes to it after each change and
   follows it when another device changes it. If two devices score at the same instant the later write wins. */
const DEVICE=newId('d');
let REV=0,liveT=null,liveBusy=0;
function liveDirty(){return liveT!==null||liveBusy>0;}
function liveWrite(build){
  if(LIB.mode==='local') return;
  liveBusy++;
  remote(db=>{
    const p=build();
    return (p?db.doc('live/current').set(p):Promise.resolve()).then(()=>{liveBusy=Math.max(0,liveBusy-1);},e=>{liveBusy=Math.max(0,liveBusy-1);throw e;});
  });
}
function livePush(){
  if(LIB.mode==='local') return;
  clearTimeout(liveT);
  liveT=setTimeout(()=>{liveT=null;liveWrite(()=>{if(!M) return null;REV++;return {json:JSON.stringify(M),rev:REV,by:DEVICE,at:new Date().toISOString()};});},150);
}
function liveClear(){
  clearTimeout(liveT);liveT=null;
  liveWrite(()=>{REV++;return {cleared:true,rev:REV,by:DEVICE,at:new Date().toISOString()};});
}
function liveApply(x,first){
  if(x&&x.by===DEVICE) return;
  if(liveDirty()) return;
  if(!x){if(M) livePush();return;}
  if(first&&M&&M.savedAt&&x.at&&String(M.savedAt)>String(x.at)){livePush();return;}
  if(x.cleared){
    if(typeof x.rev==='number'&&x.rev>REV) REV=x.rev;
    if(M){M=null;clearSaved();ui=freshUi();ui.top=true;if(!first) toast('The match was ended on another device');render();}
    else if(PENDING){PENDING=null;persistPending();render();}
    return;
  }
  let m=null;try{m=JSON.parse(x.json);}catch(e){}
  if(!m||m.v!==1||!m.innings||!m.teams) return;
  const had=!!M,prevCur=M?M.cur:-1;
  if(typeof x.rev==='number'&&x.rev>REV) REV=x.rev;
  if(!had){PENDING=liveInfo(m)?m:null;persistPending();render();return;}
  M=m;
  if(first){try{if(matchOutcome(M,analyse())){M=null;clearSaved();if(had) render();return;}}catch(e){}}
  try{localStorage.setItem(KEY,JSON.stringify(M));}catch(e){}
  if(!had){ui=freshUi();ui.view=M.cur;ui.top=true;}
  else if(M.cur!==prevCur){ui.view=M.cur;ui.wk=null;ui.sub=null;ui.chg=false;}
  else ui.view=Math.min(ui.view,M.cur);
  render();
}

function howText(inn,b){
  if(!b.out) return 'not out';
  const bw=b.by!=null?M.teams[inn.bowl].players[b.by]:'';
  const f=(b.f!=null&&b.f!=='')?M.teams[inn.bowl].players[b.f]:'';

/* ---- people: up to 3 people play as the teams. Each match is a win for the person who played as the winning team. ---- */
const PMAX=3;
const STAGE_NAME={group:'Group stage',qf:'Quarter-finals',sf:'Semi-finals',final:'Final'};
function peopleMode(T){return (T.people||[]).length>=2;}
function pName(T,id){const q=(T.people||[]).find(x=>x.id===id);return q?q.name:'';}
function ownerOf(T,id){return (T.owner||{})[id]||'';}
function fixWinner(T,f){
  if(!f.done||!f.result||!f.pa||!f.pb||f.pa===f.pb) return null;
  const w=f.result.win;return w==='a'?f.pa:w==='b'?f.pb:null;
}
function fixDoneAt(f){return (f.result&&(f.result.doneAt||f.result.at))||'';}
function peopleScore(T,upto){
  const wins={};(T.people||[]).forEach(q=>{wins[q.id]=0;});
  const done=T.fixtures.map((f,i)=>({f:f,i:i})).filter(x=>x.f.done&&x.f.result).sort((a,b)=>String(fixDoneAt(a.f)).localeCompare(String(fixDoneAt(b.f)))||a.i-b.i);
  for(const x of done){const w=fixWinner(T,x.f);if(w&&wins[w]!=null) wins[w]++;if(upto&&x.f===upto) break;}
  return (T.people||[]).map(q=>({id:q.id,name:q.name,w:wins[q.id]}));
}
function scoreText(list){
  if(!list.length) return '';
  const s=list.slice().sort((a,b)=>b.w-a.w||a.name.localeCompare(b.name));
  const nums=s.map(x=>x.w).join('-');
  if(s.length>1&&s[0].w===s[1].w) return 'Level '+nums;
  return nums+' to '+s[0].name;
}
function tourScore(T,upto){return peopleMode(T)?scoreText(peopleScore(T,upto)):'';}
function rankTeams(T,stage){
  const w={},l={};T.teams.forEach(t=>{w[t.id]=0;l[t.id]=0;});
  T.fixtures.forEach(f=>{if(f.stage!==stage||!f.done||!f.result) return;const r=f.result.win;if(r==='a'){w[f.a]++;l[f.b]++;}else if(r==='b'){w[f.b]++;l[f.a]++;}});
  return T.teams.map((t,i)=>({id:t.id,i:i})).sort((a,b)=>w[b.id]-w[a.id]||l[a.id]-l[b.id]||a.i-b.i).map(x=>x.id);
}
/* A tie or draw sends the higher seed through. */
function winnerTeam(f){return f.result&&f.result.win==='b'?f.b:f.a;}
function mkFix(T,a,b,label,stage,slot){
  const pa=ownerOf(T,a),pb=ownerOf(T,b);
  return {id:newId('f'),a:a,b:b,label:label,stage:stage,slot:slot,pa:pa,pb:pb===pa?'':pb,done:false,result:null};
}
/* Works out the next stage once every match in the last one is played: 8 or more teams go to quarter-finals, 4 to 7 to semi-finals, fewer straight to the final. */
function nextStage(T){
  const order=['group','qf','sf','final'];let last=null;
  order.forEach(k=>{if(T.fixtures.some(f=>f.stage===k)) last=k;});
  if(!last||last==='final') return null;
  const cur=T.fixtures.filter(f=>f.stage===last).sort((a,b)=>(a.slot||0)-(b.slot||0));
  if(!cur.every(f=>f.done&&f.result)) return {wait:true,from:last};
  const rk=rankTeams(T,'group'),n=T.teams.length;
  let key,pairs=[];
  if(last==='group'){
    if(n>=8){key='qf';pairs=[[0,7],[3,4],[1,6],[2,5]].map(q=>[rk[q[0]],rk[q[1]]]);}
    else if(n>=4){key='sf';pairs=[[0,3],[1,2]].map(q=>[rk[q[0]],rk[q[1]]]);}
    else{key='final';pairs=[[rk[0],rk[1]]];}
  }else{
    key=last==='qf'?'sf':'final';
    const w=cur.map(winnerTeam);
    for(let i=0;i+1<w.length;i+=2) pairs.push(rk.indexOf(w[i])<=rk.indexOf(w[i+1])?[w[i],w[i+1]]:[w[i+1],w[i]]);
  }
  if(!pairs.length) return null;
  return {key:key,pairs:pairs,labels:pairs.map((q,i)=>key==='final'?'Final':(key==='qf'?'Quarter-final ':'Semi-final ')+(i+1))};
}
function tourSummaryHtml(T){

  const rows=tourTable(T);

  const live=T.fixtures.filter(f=>f.live&&!f.done).map(f=>esc(tName(T,f.a))+' v '+esc(tName(T,f.b))).join(', ');
  return pscore+(pairs.length?pairs.map(g=>{

function genFixtures(T,rounds){
  const ids=T.teams.map(t=>t.id),out=[];
  if(T.type==='WTC'){
    for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) for(let k=1;k<=rounds;k++)
      out.push({id:newId('f'),a:ids[i],b:ids[j],label:'Test '+k+' of '+rounds,done:false,result:null});
  }else{
    for(let r=1;r<=rounds;r++) for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++)
      out.push({id:newId('f'),a:r%2?ids[i]:ids[j],b:r%2?ids[j]:ids[i],label:'League match'+(rounds>1?' (round '+r+')':''),done:false,result:null});
  }
  return out;
}
/* No points: each pair of teams just has a running score of wins, e.g. 3-1. */
function tourPairs(T){
  const map={},list=[];
  T.fixtures.forEach(f=>{
    const key=[f.a,f.b].sort().join('|');
    let g=map[key];
    if(!g){g={a:f.a,b:f.b,wa:0,wb:0,ties:0,draws:0,played:0,total:0,fx:[]};map[key]=g;list.push(g);}
    g.total++;g.fx.push(f);
    if(!f.done||!f.result) return;
    g.played++;
    const w=f.result.win;
    if(w==='tie') g.ties++;
    else if(w==='draw') g.draws++;
    else{const winner=w==='a'?f.a:f.b;if(winner===g.a) g.wa++;else g.wb++;}
  });
  return list;
}
function tourTable(T){
  const rows={};
  T.teams.forEach(t=>{rows[t.id]={id:t.id,name:t.name,p:0,w:0,l:0,t:0,d:0};});
  T.fixtures.forEach(f=>{
    if(!f.done||!f.result) return;
    const A=rows[f.a],B=rows[f.b];if(!A||!B) return;
    A.p++;B.p++;
    const w=f.result.win;
    if(w==='a'||w==='b'){const W=w==='a'?A:B,L=w==='a'?B:A;W.w++;L.l++;}
    else if(w==='tie'){A.t++;B.t++;}
    else{A.d++;B.d++;}
  });
  return Object.keys(rows).map(k=>rows[k]).sort((a,b)=>b.w-a.w||a.l-b.l||a.name.localeCompare(b.name));
}
/* Called when a match ends: files the result against its fixture. */
function tourRecord(A,out,rec){
  if(!M||!M.tour||!out) return;
  const T=TOURS.find(x=>x.id===M.tour.tid),f=T&&T.fixtures.find(x=>x.id===M.tour.fid);
  if(!f) return;
  const win=out.drawn?'draw':out.win===0?'a':out.win===1?'b':'tie';
  f.done=true;f.live=false;
  f.result={win:win,text:out.text,rec:M.recId,at:rec.at,doneAt:new Date().toISOString(),toss:rec.toss,scores:rec.scores,summary:rec.summary};
  const sc=tourScore(T,f);f.result.score=sc;
  tlog(T,'Result: '+tName(T,f.a)+' v '+tName(T,f.b)+' ('+f.label+'): '+out.text+(sc?'. Tournament score: '+sc:''));
  if(f.stage==='final'&&sc) tlog(T,'Tournament finished. Result: '+sc);
  tourSave(T);
}
function tourAbandon(){
  if(!M||!M.tour||M.recKey) return;
  const T=TOURS.find(x=>x.id===M.tour.tid),f=T&&T.fixtures.find(x=>x.id===M.tour.fid);
  if(f&&f.live&&!f.done){f.live=false;tlog(T,'Match stopped before a result: '+tName(T,f.a)+' v '+tName(T,f.b));tourSave(T);}
}
/* If the last ball is undone so the match is no longer finished, the fixture goes back to being unplayed. */
function tourUndo(){
  if(!M||!M.tour) return;
  const T=TOURS.find(x=>x.id===M.tour.tid),f=T&&T.fixtures.find(x=>x.id===M.tour.fid);
  if(f&&f.done&&f.result&&f.result.rec===M.recId){f.done=false;f.live=true;f.result=null;tlog(T,'Result removed (last ball undone): '+tName(T,f.a)+' v '+tName(T,f.b));tourSave(T);}
}

  const roundBtns=rounds.map(r=>'<button class="opt" data-act="sched-rounds" data-v="'+r+'" aria-pressed="'+(m.rounds===r)+'">'+(wtc?plural(r,'Test'):(r===1?'Once':'Twice'))+'</button>').join('');
  const sel=(f,val)=>'<select data-f="tm-'+f+'" aria-label="Team '+f.toUpperCase()+'"><option value="">Choose team</option>'+T.teams.map(t=>'<option value="'+esc(t.id)+'"'+(val===t.id?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select>';
  const stages=tourStages(T).map(s=>'<option value="'+esc(s)+'"'+(m.stage===s?' selected':'')+'>'+esc(s)+'</option>').join('');
  return '<div class="scrim" data-act="tm-close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Add schedule">'+
    '<h2>Add schedule</h2><p class="muted" style="margin:0">Set how the teams play each other. Fixtures go on the end of the schedule. You can reorder them and play them in any order.</p>'+
    '<div class="lab">'+(wtc?'Tests in each series':'Each team plays each other')+'</div><div class="opts">'+roundBtns+'</div>'+
    '<div class="actions"><button class="btn primary" data-act="sched-gen"'+(n<2?' disabled':'')+'>Create '+plural(pairs*m.rounds,'fixture')+'</button></div>'+
    '<div class="lab">Or add one fixture</div>'+
    '<div class="grid2"><label class="field"><span>Team A</span>'+sel('a',m.a)+'</label><label class="field"><span>Team B</span>'+sel('b',m.b)+'</label></div>'+
    '<label class="field" style="margin-top:12px"><span>Stage</span><select data-f="tm-stage" aria-label="Stage">'+stages+'</select></label>'+
    '<div class="actions"><button class="btn" data-act="sched-add">Add fixture</button></div>'+
    '<div class="actions" style="margin-top:18px"><button class="btn primary" data-act="tm-close">Done</button></div></div></div>';
}
function actTour(a,d){
  const T=curTour();
  switch(a){
    case 'tour-type':ui.tnew.type=d.v;return true;
    case 'tour-create':{
      const n=ui.tnew,name=normName(n.name);
      if(!name){toast('Give the tournament a name');return false;}
      let overs=null;
      if(n.type==='Custom'){overs=parseInt(n.overs,10);if(!(overs>=1)){toast('Enter the overs per innings');return false;}overs=clamp(overs,1,90);}
      const t={id:newId('o'),name:name,type:n.type,overs:overs,teams:[],fixtures:[],at:new Date().toISOString()};
      tlog(t,'Tournament created: '+TT[t.type]);tourSave(t);ui.tourId=t.id;ui.tnew={name:'',type:n.type,overs:n.overs};ui.top=true;return true;}
    case 'tour-open':ui.tourId=d.id;ui.top=true;return true;
    case 'tour-finish':if(T){T.finished=true;tlog(T,'Tournament marked as finished');tourSave(T);}return true;
    case 'tour-reopen':if(T){T.finished=false;tlog(T,'Tournament reopened');tourSave(T);}return true;
    case 'tour-back':ui.tourId=null;ui.top=true;return true;
    case 'tour-del-arm':ui.armed='to'+d.id;return true;
    case 'tour-del':tourDelete(d.id);if(ui.tourId===d.id) ui.tourId=null;return true;
    case 'tm-open':if(!T) return false;ui.tm={kind:d.v,q:'',rounds:1,a:'',b:'',stage:tourStages(T)[0]};return true;
    case 'tm-close':ui.tm=null;return true;
    case 'tm-team-toggle':{
      if(!T) return false;
      const i=T.teams.findIndex(x=>x.id===d.id);
      if(i>=0){
        if(T.fixtures.some(f=>f.a===d.id||f.b===d.id)){toast('Remove that team\'s fixtures first');return false;}
        tlog(T,'Team removed: '+T.teams[i].name);T.teams.splice(i,1);
      }else{const lt=LIB.teams.find(x=>x.id===d.id);if(lt){T.teams.push({id:lt.id,name:lt.name});tlog(T,'Team added: '+lt.name);}}
      tourSave(T);
      const l=$('tmlist');if(l&&ui.tm) l.innerHTML=tmTeamsListHtml(T);
      return false;}
    case 'tm-team-remove':{
      if(!T) return false;
      if(T.fixtures.some(f=>f.a===d.id||f.b===d.id)){toast('Remove that team\'s fixtures first');return false;}
      tlog(T,'Team removed: '+tName(T,d.id));T.teams=T.teams.filter(x=>x.id!==d.id);if(T.owner) delete T.owner[d.id];tourSave(T);return true;}
    case 'sched-rounds':ui.tm.rounds=+d.v;return true;
    case 'sched-gen':{
      if(!T||T.teams.length<2) return false;
      const add=genFixtures(T,ui.tm.rounds);T.finished=false;T.fixtures=T.fixtures.concat(add);tlog(T,'Schedule added: '+plural(add.length,'fixture')+(T.type==='WTC'?' ('+plural(ui.tm.rounds,'Test')+' per series)':ui.tm.rounds===2?' (each team plays the others twice)':' (each team plays the others once)'));tourSave(T);
      toast('Added '+plural(add.length,'fixture'));return true;}
    case 'sched-add':{
      const m=ui.tm;
      if(!T||!m.a||!m.b){toast('Choose both teams');return false;}
      if(m.a===m.b){toast('Choose two different teams');return false;}
      T.finished=false;T.fixtures.push({id:newId('f'),a:m.a,b:m.b,label:m.stage||tourStages(T)[0],done:false,result:null});tlog(T,'Fixture added: '+tName(T,m.a)+' v '+tName(T,m.b)+' ('+(m.stage||tourStages(T)[0])+')');tourSave(T);
      toast(tName(T,m.a)+' v '+tName(T,m.b)+' added');return true;}
    case 'fix-play':{
      const f=T&&T.fixtures.find(x=>x.id===d.id);
      if(!f) return true;
      if(peopleMode(T)&&(!f.pa||!f.pb||f.pa===f.pb)){toast('Choose two different people to play as the two teams first');return true;}
      tourPlay(T,f);return true;}
    case 'tp-add':{
      if(!T) return false;
      const nm=normName(ui.tpName||'');
      if(!nm){toast('Type the person\'s name');return false;}
      T.people=T.people||[];
      if(T.people.length>=PMAX){toast('Up to '+PMAX+' people can play');return false;}
      if(T.people.some(q=>q.name.toLowerCase()===nm.toLowerCase())){toast(nm+' is already added');return false;}
      T.people.push({id:newId('p'),name:nm});ui.tpName='';tlog(T,'Person added: '+nm);tourSave(T);return true;}
    case 'tp-del':{
      const q=T&&(T.people||[]).find(x=>x.id===d.id);
      if(!q) return false;
      if(T.fixtures.some(f=>f.done&&(f.pa===q.id||f.pb===q.id))){toast(q.name+' has played matches, so cannot be removed');return false;}
      T.people=T.people.filter(x=>x.id!==q.id);
      Object.keys(T.owner||{}).forEach(k=>{if(T.owner[k]===q.id) delete T.owner[k];});
      T.fixtures.forEach(f=>{if(!f.done){if(f.pa===q.id) f.pa='';if(f.pb===q.id) f.pb='';}});
      if(ui.tpView===q.id) ui.tpView='';
      tlog(T,'Person removed: '+q.name);tourSave(T);return true;}
    case 'tp-view':ui.tpView=ui.tpView===d.id?'':d.id;return true;
    case 'auto-group':{
      if(!T) return false;
      if(!peopleMode(T)){toast('Add at least 2 people first');return false;}
      if(T.teams.length<2){toast('Add at least 2 teams first');return false;}
      if(T.teams.some(t=>!ownerOf(T,t.id))){toast('Choose who plays as every team first');return false;}
      if(T.fixtures.some(f=>f.stage==='group')) return false;
      const add=[];
      for(let i=0;i<T.teams.length;i++) for(let j=i+1;j<T.teams.length;j++){
        const a=T.teams[i].id,b=T.teams[j].id;
        if(ownerOf(T,a)!==ownerOf(T,b)) add.push(mkFix(T,a,b,'Group stage','group',add.length));
      }
      if(!add.length){toast('Teams need to be shared between at least two people');return false;}
      T.finished=false;T.fixtures=T.fixtures.concat(add);
      tlog(T,'Group stage created: '+plural(add.length,'match')+'. Every team plays the teams picked by the other people.');tourSave(T);
      toast('Group stage: '+plural(add.length,'match'));return true;}
    case 'auto-next':{
      if(!T) return false;
      const nx=nextStage(T);
      if(!nx||nx.wait){toast('Finish every match in this stage first');return false;}
      nx.pairs.forEach((q,i)=>T.fixtures.push(mkFix(T,q[0],q[1],nx.labels[i],nx.key,i)));
      tlog(T,STAGE_NAME[nx.key]+' created: '+nx.pairs.map(q=>tName(T,q[0])+' v '+tName(T,q[1])).join(', ')+'. Choose who plays as each team.');
      tourSave(T);toast(STAGE_NAME[nx.key]+' created');return true;}
    case 'fix-unlink':ui.setup.fixture=null;return true;
    case 'fix-move':{
      if(!T) return false;
      const i=+d.i,j=i+ +d.d;
      if(j>=0&&j<T.fixtures.length){const t=T.fixtures[i];T.fixtures[i]=T.fixtures[j];T.fixtures[j]=t;tourSave(T);}
      return true;}
    case 'fix-del':if(T){const f=T.fixtures.find(x=>x.id===d.id);if(f) tlog(T,'Fixture removed: '+tName(T,f.a)+' v '+tName(T,f.b)+' ('+f.label+')');T.fixtures=T.fixtures.filter(x=>x.id!==d.id);tourSave(T);}return true;
    case 'fix-clear-arm':ui.armed='fc';return true;
    case 'fix-clear':if(T){tlog(T,'Unplayed fixtures cleared');T.fixtures=T.fixtures.filter(x=>x.done);tourSave(T);}return true;
  }
  return null;
}

/* The toss is a bat with two sides. Internally 'heads' is Mountains and 'tails' is Rivers, which keeps older saved matches working. */
function sideName(v){return v==='tails'||v==='rivers'?'Rivers':'Mountains';}
function batFace(side){
  /* Bat seen edge-on, like a real willow bat: one side is flat and the other has the raised spine. The side facing up (not touching the ground) is the result. Mountains: the spine is on top. Rivers: the flat side is on top and the spine is underneath. */
  const handle='<rect x="3" y="43" width="46" height="11" rx="5" fill="#2B2118"/><rect x="11" y="43" width="2.2" height="11" fill="#5A4636"/><rect x="18" y="43" width="2.2" height="11" fill="#5A4636"/><rect x="25" y="43" width="2.2" height="11" fill="#5A4636"/>'+
    '<path d="M46 45 L64 44 L64 53 L46 52 Z" fill="#F6BC9A" stroke="#8A5A1E" stroke-width="1.6" stroke-linejoin="round"/>';
  const blade='<path d="M62 46 C72 43 84 38 108 37 C130 36 146 41 154 48.5 L155 51 Q155 54 151 54 L66 54 Q62 54 62 51 Z" fill="#EBC48F" stroke="#8A5A1E" stroke-width="2" stroke-linejoin="round"/>'+
    '<path d="M70 46 C84 41 100 40 122 40 C138 40 146 43 150 48" fill="none" stroke="#B98342" stroke-width="1.6" stroke-linecap="round"/>'+
    '<path d="M68 48 L150 48 M68 51.5 L150 51.5" stroke="#C9985A" stroke-width="1" opacity=".8"/>';
  const g=handle+blade;
  return '<svg viewBox="0 0 158 74" aria-hidden="true">'+(side==='heads'?g:'<g transform="translate(0 97) scale(1 -1)">'+g+'</g>')+'</svg>';
}
function tn(i){return normName(ui.setup.slots[i].name)||('Team '+'AB'[i]);}
function tnSpan(i){return '<span data-tn="'+i+'">'+esc(tn(i))+'</span>';}
function tossHtml(){
  const s=ui.setup,flip=s.tossMode==='flip',c=s.coin;
  const mode=[['flip','Bat Flip'],['manual','Toss already done']].map(x=>'<button class="opt" data-act="toss-mode" data-v="'+x[0]+'" aria-pressed="'+(s.tossMode===x[0])+'">'+x[1]+'</button>').join('');
  let body='';
  if(flip){
    const callers=[0,1].map(i=>'<button class="opt" data-act="toss-caller" data-v="'+i+'" aria-pressed="'+(s.caller===String(i))+'">'+tnSpan(i)+'</button>').join('');
    const calls=['heads','tails'].map(x=>'<button class="opt" data-act="toss-call" data-v="'+x+'" aria-pressed="'+(s.call===x)+'">'+sideName(x)+'</button>').join('');
    const cls=c.state==='flipping'?'flip-'+c.result:c.state==='done'?'rest-'+c.result:'';
    body+='<div class="lab">Who calls</div><div class="opts">'+callers+'</div><div class="lab">The call</div><div class="opts">'+calls+'</div><p class="note">Mountains is the triangular ridged side of the bat. Rivers is the flat side. The side facing up, away from the ground, is the result.</p>'+
      '<div class="batwrap"><div class="batflip '+cls+'" role="img" aria-label="'+(c.state==='done'?'The bat landed on '+sideName(c.result):'Bat to flip')+'"><div class="face mountains">'+batFace('heads')+'</div><div class="face rivers">'+batFace('tails')+'</div></div></div>'+
      '<div class="tossresult">'+(c.state==='done'?'<p class="big">'+sideName(c.result)+'</p><p>'+tnSpan(+s.caller)+' called '+sideName(s.call)+'. <b>'+tnSpan(+s.winner)+'</b> won the toss.</p>':c.state==='flipping'?'<p class="muted">Flipping...</p>':'<p class="muted">Tap Flip bat to toss.</p>')+'</div>'+
      '<div class="actions" style="justify-content:center"><button class="btn primary" data-act="toss-flip"'+(c.state==='flipping'?' disabled':'')+'>'+(c.state==='done'?'Flip again':'Flip bat')+'</button></div>';
  }else{

  }

/* ---------- find a player: search all saved players, add to a team, remove from the list, or remove from a team (each asks first) ---------- */
function teamOfPlayer(id){return LIB.teams.find(t=>t.playerIds.indexOf(id)>=0)||null;}
function psResultsHtml(){
  const q=(ui.psq||'').trim().toLowerCase(),inTeamMode=ui.psf==='team';
  if(!LIB.players.length) return '<div class="empty">No players saved yet.</div>';
  if(!q&&!inTeamMode) return '<div class="empty">Type a name to search all '+plural(LIB.players.length,'saved player')+'.</div>';
  let list=LIB.players.filter(p=>{
    const tm=teamOfPlayer(p.id);
    if(inTeamMode&&!tm) return false;
    if(!q) return true;
    return p.name.toLowerCase().indexOf(q)>=0||(inTeamMode&&tm.name.toLowerCase().indexOf(q)>=0);
  });
  if(!list.length) return '<div class="empty">'+(inTeamMode?'No players in a team match':'No saved players match')+' "'+esc(ui.psq||'')+'".</div>';
  const total=list.length;list=list.slice(0,40);

    const tm=teamOfPlayer(p.id);

      ?'<button class="btn small danger" data-act="ps-unteam-open" data-id="'+esc(p.id)+'">Remove from team</button>'

         :'<button class="btn small primary" data-act="ps-add-open" data-id="'+esc(p.id)+'"'+(noTeams?' disabled title="Create a team first"':'')+'>Add to team</button>')+

    return '<div class="psrow"><span class="pn">'+esc(p.name)+sub+'</span><span class="pbtns">'+btns+'</span></div>';

function psSyncEditor(teamId,pid,adding){
  /* If that team is open in the editor, keep the editor in step so it cannot save an out-of-date squad over the change. */
  const ed=ui.squads&&ui.squads.editor;
  if(!ed||ed.teamId!==teamId) return;
  if(adding){if(ed.sel.indexOf(pid)<0) ed.sel.push(pid);}
  else{ed.sel=ed.sel.filter(x=>x!==pid);if(ed.cap===pid) ed.cap='';if(ed.wk===pid) ed.wk='';}

function psConfirm(){
  const ps=ui.ps;if(!ps) return;

  if(!p){ui.ps=null;return;}

    if(cur){toast(p.name+' is already in '+cur.name);ui.ps=null;return;}
    if(t.playerIds.length>=55){toast(t.name+' already has 55 players');return;}
    libPutTeam(t.id,t.name,t.playerIds.concat([p.id]),t.capId,t.wkId);
    psSyncEditor(t.id,p.id,true);
    toast(p.name+' added to '+t.name);

    libDelPlayer(p.id);

    if(!cur){ui.ps=null;return;}
    libPutTeam(cur.id,cur.name,cur.playerIds.filter(x=>x!==p.id),cur.capId===p.id?'':cur.capId,cur.wkId===p.id?'':cur.wkId);

function startMatch(){
  const s=ui.setup;
  const test=s.fmt==='Test';
  let overs=null;
  if(!test){
    overs=parseInt(s.overs,10);
    if(!(overs>=1)){toast(s.fmt==='Custom'?'Enter the number of overs for this match':'Enter the overs per innings');return false;}
    overs=clamp(overs,1,90);
  }
  const teams=[];
  for(let k=0;k<2;k++){
    const p=s.slots[k];
    const name=normName(p.name)||('Team '+'AB'[k]);
    const ids=uniq(p.sel.filter(id=>libName(id)!=null));
    if(ids.length!==p.sel.filter(id=>libName(id)!=null).length){toast('A player is listed twice for '+name+'. Remove the repeat.');return false;}
    if(ids.length<2){toast(name+' needs at least 2 players');return false;}
    if(s.fmt==='IPL'&&ids.length!==16){toast('IPL needs all 16 players for '+name+' (11 plus 5 substitutes). You have '+ids.length+'.');return false;}
    if(ids.length>16){toast(name+' can have at most 16 players in a match. Remove '+(ids.length-16)+' to continue.');return false;}
    if(ids.indexOf(p.cap)<0){toast('Choose a captain for '+name);return false;}
    if(ids.indexOf(p.wk)<0){toast('Choose a wicketkeeper for '+name);return false;}
    const xi=Math.min(11,ids.length);
    const ci=ids.indexOf(p.cap),wi=ids.indexOf(p.wk);
    teams.push({name:name,players:ids.map(libName),xi:xi,active:Array.from({length:xi},(_,k)=>k),gone:[],cap:ci>=0?ci:null,wk:wi>=0?wi:null});
  }
  if(teams[0].name.toLowerCase()===teams[1].name.toLowerCase()){toast('The two teams need different names');return false;}
  const minSize=Math.min(teams[0].xi,teams[1].xi);
  let maxPer=null;
  if(!test){
    const userMax=parseInt(s.maxper,10);
    const base=userMax>0?userMax:defaultMaxPer(s.fmt,overs);
    maxPer=Math.max(base,Math.ceil(overs/(minSize-1)));
  }
  const fi=s.fixture?fixInfo(s.fixture):null;
  if(fi&&(s.slots[0].teamId!==fi.f.a||s.slots[1].teamId!==fi.f.b)){toast('This is a tournament match. Team A must be '+tName(fi.T,fi.f.a)+' and Team B '+tName(fi.T,fi.f.b)+'.');return false;}
  if(s.winner===''||!s.choice){toast('Do the toss first, then choose bat or bowl');return false;}
  const winner=+s.winner,choice=s.choice;
  const bat=choice==='bat'?winner:1-winner;
  saveTeam('0',true);saveTeam('1',true);
  PENDING=null;persistPending();
  M={v:1,uid:newId('u'),tour:fi?{tid:fi.T.id,fid:fi.f.id,label:fi.T.name+' · '+fi.f.label}:null,format:s.fmt,maxSubs:s.fmt==='IPL'?1:null,subsLog:[],nInn:test?4:2,overs:overs,maxPer:maxPer,teams:teams,toss:{winner:winner,choice:choice,mode:s.tossMode,caller:+s.caller,call:s.call,result:s.tossMode==='flip'?s.coin.result:null},
     innings:[{bat:bat,bowl:1-bat,openers:null,events:[],declared:false}],cur:0};
  if(fi){fi.f.live=true;tlog(fi.T,'Match started: '+tName(fi.T,fi.f.a)+' v '+tName(fi.T,fi.f.b)+' ('+fi.f.label+')');tourSave(fi.T);}
  return true;
}

function actLib(a,d){
  switch(a){
    case 'screen':ui.screen=d.v;ui.top=true;return true;
    case 'tp-add':case 'tp-del':case 'tp-view':case 'auto-group':case 'auto-next':case 'tour-type':case 'tour-create':case 'tour-open':case 'tour-finish':case 'tour-reopen':case 'tour-back':case 'tour-del-arm':case 'tour-del':case 'tm-open':case 'tm-close':case 'tm-team-toggle':case 'tm-team-remove':case 'sched-rounds':case 'sched-gen':case 'sched-add':case 'fix-play':case 'fix-unlink':case 'fix-move':case 'fix-del':case 'fix-clear-arm':case 'fix-clear':return actTour(a,d)===true;
    case 'preset':ui.setup.overs=String(d.v);ui.setup.fmt=d.v==='20'?'T20':d.v==='50'?'ODI':'Custom';return true;
    case 'format':{const s=ui.setup;if(s.fixture) return false;s.fmt=d.v;s.maxper='';if(d.v==='T20'||d.v==='IPL') s.overs='20';else if(d.v==='ODI') s.overs='50';else if(d.v==='Custom') s.overs='';return true;}
    case 'resume-pending':{
      if(!PENDING) return true;
      M=PENDING;PENDING=null;persistPending();ui=freshUi();ui.view=Math.min(M.cur,M.innings.length-1);ui.top=true;save();return true;}
    case 'pend-arm':ui.armed='pend';return true;
    case 'pend-discard':PENDING=null;persistPending();LIVEAT=nowIso();persistLive();stamp();syncSoon();ui.armed=null;return true;
    case 'add-player':addPlayerTo(d.k);return true;
    case 'team-toggle':ui.tOpen=ui.tOpen||{};ui.tOpen[d.id]=!ui.tOpen[d.id];return true;
    case 'pick-open':ui.pickK=d.k;ui.pickQ='';return true;
    case 'team-open':ui.teamK=d.k;ui.teamQ='';return true;
    case 'team-close':ui.teamK=null;return true;
    case 'team-add':pickTeam(d.k,d.id);ui.teamK=null;return true;
    case 'pick-close':ui.pickK=null;return true;
    case 'pick-toggle':{
      const p=pk(d.k),i=p.sel.indexOf(d.id);
      if(i>=0) p.sel.splice(i,1);
      else if(otherSel(d.k).indexOf(d.id)>=0) return false;
      else if(p.sel.length>=maxSel(d.k)){toast('Up to '+maxSel(d.k)+' players can be selected here');return false;}
      else p.sel.push(d.id);
      const pl=$('plist');if(pl) pl.innerHTML=pickListHtml(d.k);
      const pc=$('pcount');if(pc) pc.textContent=p.sel.length+' of '+maxSel(d.k)+(iplSquad(d.k)?' needed':' selected')+(p.sel.length>=maxSel(d.k)?' (full)':'');
      return false;}
    case 'save-team':saveTeam(d.k,false);return true;
    case 'clear-editor':ui.squads.editor={teamId:'',name:'',sel:[],newp:''};ui.focus='tn-e';return true;
    case 'edit-team':{const t=LIB.teams.find(x=>x.id===d.id);if(t){ui.squads.editor={teamId:t.id,name:t.name,sel:t.playerIds.filter(i=>libName(i)!=null),newp:'',cap:t.capId||'',wk:t.wkId||''};ui.focus='tn-e';}return true;}
    case 'del-player-arm':ui.armed='dp'+d.id;return true;
    case 'del-player':libDelPlayer(d.id);return true;
    case 'del-team-arm':ui.armed='dt'+d.id;return true;
    case 'del-team':libDelTeam(d.id);if(ui.squads.editor.teamId===d.id) ui.squads.editor={teamId:'',name:'',sel:[],newp:''};return true;
    case 'ps-filter':ui.psf=ui.psf==='team'?'all':'team';ui.focus='psq';return true;
    case 'ps-add-open':ui.ps={kind:'add',id:d.id,teamId:''};return true;
    case 'ps-remove-open':ui.ps={kind:'remove',id:d.id};return true;
    case 'ps-unteam-open':ui.ps={kind:'unteam',id:d.id};return true;
    case 'ps-cancel':ui.ps=null;return true;
    case 'ps-confirm':psConfirm();return true;
    case 'unpick':{const p=pk(d.k),i=p.sel.indexOf(d.id);if(i>=0) p.sel.splice(i,1);return true;}
    case 'move':{const p=pk(d.k),i=+d.i,j=i+ +d.d;if(j>=0&&j<p.sel.length){const t=p.sel[i];p.sel[i]=p.sel[j];p.sel[j]=t;}return true;}
    case 'toss-mode':ui.setup.tossMode=d.v;resetToss();return true;
    case 'toss-caller':ui.setup.caller=d.v;resetToss();return true;
    case 'toss-call':ui.setup.call=d.v;resetToss();return true;
    case 'toss-winner':ui.setup.winner=d.v;ui.setup.choice='';return true;
    case 'toss-choice':ui.setup.choice=d.v;return true;
    case 'toss-flip':{
      const s=ui.setup;if(s.coin.state==='flipping') return false;
      let bit;
      try{const arr=new Uint32Array(1);window.crypto.getRandomValues(arr);bit=arr[0]&1;}catch(e){bit=Math.random()<.5?1:0;}
      const result=bit?'tails':'heads';
      s.coin={state:'flipping',result:result};s.winner='';s.choice='';
      let ms=1500;try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) ms=250;}catch(e){}
      setTimeout(()=>{
        if(!M&&ui.setup===s&&s.coin.state==='flipping'&&s.coin.result===result){
          s.coin.state='done';s.winner=(s.call===result)?s.caller:String(1-(+s.caller));render();
        }
      },ms);
      return true;}
    case 'start':if(!startMatch()) return false;ui=freshUi();ui.top=true;save();return true;
  }
  return false;
}

function undoLabel(inn){
  if(M.drawn) return 'Reopen match';
  if(inn.declared) return M.overs?'Reopen innings':'Undo declaration';
  const last=inn.events[inn.events.length-1];
  if(!last) return inn.openers?'Change openers':'';
  return last.t==='ball'?'Undo last ball':last.t==='bowler'?'Undo bowler':'Undo strike swap';
}
function actionsHtml(S,inn,over){
  const ul=undoLabel(inn);
  const live=!S.done&&!over;
  const endBtn=live?'<button class="btn'+(ui.armed==='end'?' armed':' danger')+'" data-act="'+(ui.armed==='end'?'end-confirm':'end-arm')+'">'+(M.overs?(ui.armed==='end'?'Tap again to end innings':'End innings'):(ui.armed==='end'?'Tap again to declare':'Declare innings'))+'</button>':'';
  return '<div class="actions"><button class="btn primary" data-act="undo"'+(ul?'':' disabled')+'>'+(ul||'Undo')+'</button>'+(over||M.format!=='IPL'?'':'<button class="btn" data-act="sub-open">Impact player</button>')+
    (S.bowler!=null&&live?'<button class="btn" data-act="swap">Swap strike</button><button class="btn" data-act="chg-bowler">Change bowler</button>':'')+endBtn+'</div>';

function impactStatus(i){
  if((M.subsLog||[]).some(e=>e.team===i)) return 'used';
  return (M.impactChoice||[])[i]||null;
}
function goNextInnings(){
  const cu=M.innings[M.cur];
  let n=null;
  if(M.innings.length<nInnings(M)){
    n={bat:cu.bowl,bowl:cu.bat,openers:null,events:[],declared:false};
    if(cu.so) n.so=cu.so;
  }else if(M.cur===M.innings.length-1){
    const k=superNeeded(M,analyse());
    if(!k) return;
    M.sos=(M.sos||0)+1;
    n={bat:cu.bat,bowl:cu.bowl,openers:null,events:[],declared:false,so:k};
  }
  if(!n) return;
  M.innings.push(n);
  M.cur=M.innings.length-1;ui.view=M.cur;ui.tab='score';ui.mode='n';ui.top=true;
}
function maybeAdvance(){
  if(M.format!=='IPL'||M.cur!==0||M.innings.length>=nInnings(M)) return;
  const A=analyse();
  if(!A[0].done||matchOutcome(M,A)) return;
  if(impactStatus(0)&&impactStatus(1)) goNextInnings();
}
function impactHtml(){
  const first=M.innings[0].bat;
  const cards=[first,1-first].map(i=>{
    const tm=M.teams[i],st=impactStatus(i);
    const act=activeOf(M,i),gone=tm.gone||[];
    const subsLeft=tm.players.some((p,k)=>act.indexOf(k)<0&&gone.indexOf(k)<0);
    let body;
    if(st==='used'){
      const e=(M.subsLog||[]).slice().reverse().find(x=>x.team===i);
      body='<p>'+(e?esc(tm.players[e['in']])+' replaces '+esc(tm.players[e.out]):'Impact player used')+'</p><button class="btn small" data-act="impact-undo" data-t="'+i+'">Undo</button>';
    }else if(st==='none'){
      body='<p>No impact sub</p><button class="btn small" data-act="impact-change" data-t="'+i+'">Change</button>';
    }else{
      body='<div class="actions" style="margin-top:6px"><button class="btn primary" data-act="impact-open" data-t="'+i+'"'+(subsLeft?'':' disabled')+'>Impact sub</button><button class="btn" data-act="impact-none" data-t="'+i+'">No impact sub</button></div>'+(subsLeft?'':'<p class="note">No substitutes in this squad.</p>');
    }
    return '<div class="impact"><div class="name">'+esc(tm.name)+'</div>'+body+'</div>';
  }).join('');
  const ready=!!(impactStatus(0)&&impactStatus(1));
  return '<h3 style="padding:14px 0 0">Impact player</h3><p class="note" style="margin-top:0">Each team chooses before the 2nd innings: use its impact player or not. An impact player replaces one teammate, who takes no further part. The 2nd innings starts as soon as both teams have chosen.</p>'+
    '<div class="impactgrid">'+cards+'</div>'+
    '<div class="actions"><button class="btn primary" data-act="next-inn"'+(ready?'':' disabled')+'>Start 2nd innings</button></div>';
}
function subModal(A){
  const S=A[M.cur],inn=cur(),sub=ui.sub,t=sub.team,tm=M.teams[t];
  const act=activeOf(M,t),gone=tm.gone||[];

  const offOpts=act.filter(i=>busy.indexOf(i)<0);

  const teamBtns=[0,1].map(i=>'<button class="opt" data-act="sub-team" data-v="'+i+'" aria-pressed="'+(t===i)+'">'+esc(M.teams[i].name)+'</button>').join('');

    '<h2>'+(M.format==='IPL'?'Impact player':'Substitute')+(sub.lock?': '+esc(tm.name):'')+'</h2><p class="muted" style="margin:0">'+(M.maxSubs?'Each team has '+M.maxSubs+' impact player. ':'')+'The player who goes off takes no further part.</p>'+

function subsHtml(){

function tourScoreLine(){

function resultPanel(out){

function donePanel(A,ci){
  const S=A[ci],inn=M.innings[ci],t=M.teams[inn.bat],n=nInnings(M);

  if(M.overs&&ci%2===0) h+='<p>'+esc(nb)+' need <b>'+(S.runs+1)+'</b> to win from '+(inn.so?'1 over':ovLimit(M,inn)+' overs')+'.</p>';
  if(!M.overs&&n===4&&ci===1){
    const d=teamRuns(M,A,inn.bat,ci+1)-teamRuns(M,A,inn.bowl,ci+1);

function scoreTab(A){
  const ci=M.cur,S=A[ci],inn=M.innings[ci];

function wicketModal(A){

  const r=matchOutcome(M,A);
  const toss=tossText();
  return '<section class="panel pad"><h3>Match</h3><p class="big">'+esc(M.teams[0].name)+' v '+esc(M.teams[1].name)+'</p>'+
    '<p class="muted">'+esc(formatText())+'</p><p>'+esc(toss)+'.</p>'+subsHtml()+
    (r?'<p class="big" style="margin-top:10px">'+esc(r.text)+'</p>':'')+
    '<div class="actions"><button class="btn primary" data-act="copy">Copy summary</button>'+(!M.overs&&nInnings(M)===4&&!r?'<button class="btn'+(ui.armed==='draw'?' armed':' danger')+'" data-act="'+(ui.armed==='draw'?'draw-confirm':'draw-arm')+'">'+(ui.armed==='draw'?'Tap again to declare a draw':'Declare a draw')+'</button>':'')+
    '<button class="btn'+(ui.armed==='new'?' armed':' danger')+'" data-act="'+(ui.armed==='new'?'new-confirm':'new-arm')+'">'+(ui.armed==='new'?'Tap again to discard this match':'New match')+'</button></div>'+
    (ui.copyText?'<label class="field"><span>Select and copy</span><textarea id="copybox" readonly>'+esc(ui.copyText)+'</textarea></label>':'')+
    '</section>';
}

/* ---------- match actions ---------- */
function pushBall(k,r,w){
  const S=analyse()[M.cur];
  if(!S.started||S.done||S.bowler==null) return;
  cur().events.push({t:'ball',k:k,r:r,w:w||null});
}
function act(a,d){
  if(['end-arm','pend-arm','new-arm','draw-arm','del-player-arm','del-team-arm','hist-del-arm','hist-del','menu'].indexOf(a)<0) ui.armed=null;
  if(a!=='copy') ui.copyText=null;
  if(histAct(a,d)) return;
  if(!M){
    const ch=actLib(a,d);
    if(d&&d.k==='e'&&(a==='add-player'||a==='pick-toggle'||a==='unpick'||a==='move')) autoSaveEditor();
    if(ch||a==='start') render();
    return;
  }
  const inn=cur();
  switch(a){
    case 'tab':ui.tab=d.v;ui.top=true;if(d.v==='card'||d.v==='overs') ui.view=Math.min(ui.view,M.innings.length-1);break;
    case 'view':ui.view=+d.v;break;
    case 'mode':ui.mode=d.v;break;
    case 'run':pushBall(ui.mode,+d.r,null);ui.mode='n';break;
    case 'wk-open':{
      const hows={n:6,wd:3,nb:1,b:1,lb:1}[ui.mode];
      ui.wk={mode:ui.mode,how:hows===1?'Run out':null,who:'s',r:0,f:'',next:null};break;}
    case 'wk-how':ui.wk.how=d.v;ui.wk.f='';break;
    case 'wk-who':ui.wk.who=d.v;break;
    case 'wk-runs':ui.wk.r=+d.v;break;
    case 'wk-cancel':ui.wk=null;break;
    case 'wk-confirm':{
      const S=analyse()[M.cur],wk=ui.wk;
      if(!wk||!wk.how) break;
      const outIdx=(wk.how==='Run out'&&wk.who==='n')?S.non:S.striker;
      const last=S.wkts+1>=S.maxW;
      const next=last?null:(wk.next!=null?wk.next:firstUnbatted(S,cur().bat));
      let f=(wk.f!==''&&wk.f!=null)?+wk.f:null,how=wk.how;
      if(how==='Caught & bowled'){how='Caught';f=S.bowler;}
      else if(how==='Caught behind'){
        how='Caught';
        const kp=M.teams[cur().bowl].wk;
        if(kp!=null&&activeOf(M,cur().bowl).indexOf(kp)>=0) f=kp;
      }
      pushBall(wk.mode,how==='Run out'?wk.r:0,{how:how,out:outIdx,f:f,next:next});
      ui.wk=null;ui.mode='n';break;}
    case 'undo':
      M.impactChoice=[null,null];
      if(M.drawn) M.drawn=false;
      else if(inn.declared) inn.declared=false;
      else if(inn.events.length) inn.events.pop();
      else if(inn.openers) inn.openers=null;
      ui.mode='n';ui.chg=false;break;
    case 'swap':if(analyse()[M.cur].bowler!=null) inn.events.push({t:'swap'});break;
    case 'bowler':inn.events.push({t:'bowler',id:+d.i});ui.chg=false;break;
    case 'chg-bowler':ui.chg=true;break;
    case 'chg-cancel':ui.chg=false;break;
    case 'start-inn':{
      const s=+$('sel-s').value,n=+$('sel-n').value,b=+$('sel-b').value;
      if(s===n){toast('Pick two different batters');return;}
      inn.openers=[s,n];inn.events.push({t:'bowler',id:b});break;}
    case 'next-inn':
      if(M.format==='IPL'&&M.cur===0&&!(impactStatus(0)&&impactStatus(1))) break;
      goNextInnings();break;
    case 'sub-open':if(M.format!=='IPL') break;ui.sub={team:inn.bat,out:'',in:''};break;
    case 'sub-team':ui.sub.team=+d.v;ui.sub.out='';ui.sub.in='';break;
    case 'sub-cancel':ui.sub=null;break;
    case 'sub-confirm':{
      const sub=ui.sub;if(!sub||sub.out===''||sub.in==='') break;
      const tm=M.teams[sub.team];
      if(M.maxSubs!=null&&(M.subsLog||[]).filter(x=>x.team===sub.team).length>=M.maxSubs) break;
      if(!tm.active) tm.active=activeOf(M,sub.team);
      tm.gone=tm.gone||[];
      const pos=tm.active.indexOf(sub.out);if(pos<0) break;
      tm.active[pos]=sub.in;tm.gone.push(sub.out);
      M.subsLog=M.subsLog||[];M.subsLog.push({team:sub.team,out:sub.out,in:sub.in,inn:M.cur,balls:analyse()[M.cur].balls});
      toast(tm.players[sub.in]+' replaces '+tm.players[sub.out]);
      const brk=sub.brk;ui.sub=null;if(brk) maybeAdvance();break;}
    case 'impact-open':ui.sub={team:+d.t,out:'',in:'',lock:true,brk:true};break;
    case 'impact-none':M.impactChoice=M.impactChoice||[null,null];M.impactChoice[+d.t]='none';maybeAdvance();break;
    case 'impact-change':M.impactChoice=M.impactChoice||[null,null];M.impactChoice[+d.t]=null;break;
    case 'impact-undo':{
      const L=M.subsLog||[];let ix=-1;
      for(let k=L.length-1;k>=0;k--) if(L[k].team===+d.t){ix=k;break;}
      if(ix>=0){const e=L.splice(ix,1)[0],tm=M.teams[e.team],pos=tm.active.indexOf(e['in']);if(pos>=0) tm.active[pos]=e.out;tm.gone=(tm.gone||[]).filter(x=>x!==e.out);}
      break;}
    case 'sub-undo':{
      const e=(M.subsLog||[]).pop();if(!e) break;
      const tm=M.teams[e.team],pos=tm.active.indexOf(e['in']);
      if(pos>=0) tm.active[pos]=e.out;
      tm.gone=(tm.gone||[]).filter(x=>x!==e.out);
      ui.sub={team:e.team,out:'',in:''};break;}
    case 'draw-arm':ui.armed='draw';break;
    case 'draw-confirm':M.drawn=true;break;
    case 'back-inn':
      if(M.cur>0&&!M.innings[M.cur].events.length&&!M.innings[M.cur].openers){const was=M.innings.pop();if(was.so&&M.innings.length%2===0) M.sos=Math.max(0,(M.sos||0)-1);M.cur--;ui.view=M.cur;}break;
    case 'end-arm':ui.armed='end';break;
    case 'end-confirm':inn.declared=true;break;
    case 'new-arm':ui.armed='new';break;
    case 'new-confirm':if(!M.recKey&&M.innings.some(x=>x.events.length)) histRecord(true);tourAbandon();clearSaved();M=null;liveClear();syncSoon();ui=freshUi();ui.top=true;render();return;
    case 'copy':{
      const text=summaryText(analyse());
      const fallback=()=>{ui.copyText=text;render();};
      try{navigator.clipboard.writeText(text).then(()=>toast('Summary copied'),fallback);}catch(e){fallback();}
      return;}
  }
  {const r=matchOutcome(M,analyse());if(r){const k=r.text;if(M.recKey!==k){M.recKey=k;histRecord(false);}}else if(M.recKey){M.recKey=null;tourUndo();}}
  save();render();
}

function keepBarVisible(id){
  const fix=()=>{
    const el=$(id);if(!el) return;
    const bar=el.closest('.addrow')||el,r=bar.getBoundingClientRect();
    const vv=window.visualViewport,h=vv?vv.height:(window.innerHeight||document.documentElement.clientHeight);
    if(r.bottom>h-16||r.top<8){
      let sp=bar.parentElement;
      while(sp&&sp!==document.body){const cs=getComputedStyle(sp);if(/(auto|scroll)/.test(cs.overflowY)&&sp.scrollHeight>sp.clientHeight) break;sp=sp.parentElement;}
      if(sp&&sp!==document.body&&sp!==document.documentElement){const pr=sp.getBoundingClientRect();sp.scrollTop+=r.bottom-pr.bottom+16;}
      else window.scrollBy(0,r.bottom-h+16);
    }
  };
  fix();
  if(window.requestAnimationFrame) requestAnimationFrame(fix);
  setTimeout(fix,120);
}
function render(){
  const ae=document.activeElement;
  const fid=(ae&&ae.id&&$('app').contains(ae))?ae.id:null;
  let ss=null,se=null;
  try{ss=ae.selectionStart;se=ae.selectionEnd;}catch(e){}
  const sy=window.scrollY;
  $('app').innerHTML=(ui.hist?histHtml():M?renderMatch():renderSetup())+((!M&&!ui.hist&&ui.pickK!=null)?pickModal():'')+((!M&&!ui.hist&&ui.teamK!=null)?teamModal():'')+((!M&&!ui.hist&&ui.tm)?tourModal():'')+((!M&&!ui.hist&&ui.screen==='squads'&&ui.ps)?psModal():'');
  const want=ui.focus||fid;
  if(want){
    const el=$(want);
    if(el){
      try{el.focus({preventScroll:true});if(ui.focus&&el.setSelectionRange) el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
      if(want===fid&&!ui.focus&&ss!=null){try{el.setSelectionRange(ss,se);}catch(e){}}
    }
  }
  const wasFocus=ui.focus;
  ui.focus=null;
  window.scrollTo(0,ui.top?0:sy);ui.top=false;
  /* After adding a player, scroll so the whole add-player bar (box and button) is in sight at the bottom of the screen. */
  if(wasFocus&&String(wasFocus).indexOf('np-')===0) keepBarVisible(wasFocus);
  const cb=$('copybox');if(cb){cb.focus();cb.select();}
}

document.addEventListener('click',e=>{
  if(ui.menu&&!e.target.closest('.menuwrap')){ui.menu=false;if(!e.target.closest('[data-act]')){render();return;}}
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled) return;
  if(el.dataset.act==='wk-cancel-bg'){if(e.target===el){ui.wk=null;render();}return;}
  if(el.dataset.act==='tm-close-bg'){if(e.target===el){ui.tm=null;render();}return;}
  if(el.dataset.act==='team-close-bg'){if(e.target===el){ui.teamK=null;render();}return;}
  if(el.dataset.act==='ps-close-bg'){if(e.target===el){ui.ps=null;render();}return;}
  if(el.dataset.act==='pick-close-bg'){if(e.target===el){ui.pickK=null;render();}return;}
  if(el.dataset.act==='sub-cancel-bg'){if(e.target===el){ui.sub=null;render();}return;}
  act(el.dataset.act,el.dataset);
});
function updateToss(){document.querySelectorAll('[data-tn]').forEach(el=>{el.textContent=tn(+el.dataset.tn);});}
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.f==='sync'){SYNC.url=e.target.value.trim();persistSync();SYNC.last=null;syncTry=0;clearTimeout(syncRetryT);clearTimeout(syncUrlT);SYNC.ready=!SYNC.url;if(SYNC.url) syncUrlT=setTimeout(()=>syncStart(()=>syncPush(true)),1200);return;}
  if(e.target.dataset&&e.target.dataset.f==='psq'){ui.psq=e.target.value;const l=$('psres');if(l) l.innerHTML=psResultsHtml();return;}
  if(e.target.dataset&&e.target.dataset.f==='psearch'){ui.pickQ=e.target.value;const l=$('plist');if(l&&ui.pickK!=null) l.innerHTML=pickListHtml(ui.pickK);return;}
  if(e.target.dataset&&e.target.dataset.f==='tmsearch'){if(ui.tm){ui.tm.q=e.target.value;const T=curTour(),l=$('tmlist');if(T&&l) l.innerHTML=tmTeamsListHtml(T);}return;}
  if(e.target.dataset&&e.target.dataset.f==='tsearch'){ui.teamQ=e.target.value;const l=$('tlist');if(l&&ui.teamK!=null) l.innerHTML=teamListHtml(ui.teamK);return;}
  if(M) return;
  const t=e.target,d=t.dataset||{};
  if(d.f==='qopen'){
    /* Typing in a search bar on the form opens the list with that search already applied. */
    const v=t.value;t.value='';
    if(d.q==='team'){ui.teamK=d.k;ui.teamQ=v;ui.focus='tsearch';}
    else{ui.pickK=d.k;ui.pickQ=v;ui.focus='psearch';}
    render();return;
  }
  if(d.s){ui.setup[d.s]=t.value;return;}
  if(d.f==='tname'){ui.tnew.name=t.value;return;}
  if(d.f==='tpname'){ui.tpName=t.value;return;}
  if(d.f==='tovers'){ui.tnew.overs=t.value;return;}
  if(d.f==='name'){pk(d.k).name=t.value;updateToss();}
  else if(d.f==='newp'){if(d.k==='lib') ui.squads.newp=t.value;else pk(d.k).newp=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(!M){
    if(d.s){ui.setup[d.s]=t.value;if(d.s==='overs'){const f=ui.setup.fmt;if(f!=='Custom'){ui.setup.fmt=((f==='IPL'||f==='T20')&&t.value==='20')?f:t.value==='20'?'T20':t.value==='50'?'ODI':'Custom';}render();}return;}
    if(d.f==='ps-team'){if(ui.ps) ui.ps.teamId=t.value;render();return;}
    if(d.f==='name'&&d.k==='e'){autoSaveEditor();return;}
    if(d.f==='tp-owner'){
      const T=curTour();
      if(T){
        T.owner=T.owner||{};if(t.value) T.owner[d.id]=t.value;else delete T.owner[d.id];
        T.fixtures.forEach(f=>{if(!f.done&&f.stage==='group'){if(f.a===d.id) f.pa=t.value;if(f.b===d.id) f.pb=t.value;}});
        tlog(T,tName(T,d.id)+' is played by '+(pName(T,t.value)||'no one yet'));tourSave(T);render();
      }
      return;
    }
    if(d.f==='tp-fix'){
      const T=curTour(),f=T&&T.fixtures.find(x=>x.id===d.id);
      if(f&&!f.done){
        if(d.side==='a') f.pa=t.value;else f.pb=t.value;
        tlog(T,f.label+': '+tName(T,f.a)+' v '+tName(T,f.b)+' - '+(f.pa?pName(T,f.pa):'?')+' plays as '+tName(T,f.a)+', '+(f.pb?pName(T,f.pb):'?')+' plays as '+tName(T,f.b));
        tourSave(T);render();
      }
      return;
    }
    if(d.f&&d.f.indexOf('tm-')===0&&ui.tm){ui.tm[d.f.slice(3)]=t.value;return;}
    if(d.f==='team'){pickTeam(d.k,t.value);render();}
    else if(d.f==='cap'||d.f==='wkp'){const p=pk(d.k);if(d.f==='cap') p.cap=t.value;else p.wk=t.value;if(d.k==='e') autoSaveEditor();}
    else if(d.f==='tick'){
      const p=pk(d.k),i=p.sel.indexOf(d.id);
      if(t.checked&&i<0&&otherSel(d.k).indexOf(d.id)<0){if(p.sel.length>=maxSel(d.k)) toast('Up to '+maxSel(d.k)+' players can be selected here');else p.sel.push(d.id);}
      else if(!t.checked&&i>=0) p.sel.splice(i,1);
      if(d.k==='e') autoSaveEditor();
      render();
    }else if(d.f==='rename'){
      const name=normName(t.value),cur=LIB.players.find(p=>p.id===d.id);
      if(cur&&name&&name!==cur.name){
        if(LIB.players.some(p=>p.id!==d.id&&p.name.toLowerCase()===name.toLowerCase())) toast(name+' is already saved');
        else libPutPlayer(d.id,name);
      }
      render();
    }
    return;
  }
  if(d.bind&&ui.wk){ui.wk[d.bind]=t.value===''?'':+t.value;}
  if(d.subbind&&ui.sub){ui.sub[d.subbind]=t.value===''?'':+t.value;render();}
});
document.addEventListener('keydown',e=>{
  const t=e.target,d=t.dataset||{};
  if(!M&&e.key==='Escape'&&(ui.pickK!=null||ui.teamK!=null||ui.tm||ui.ps)){ui.pickK=null;ui.teamK=null;ui.tm=null;ui.ps=null;render();return;}
  if(!M&&d.f==='newp'&&e.key==='Enter'){e.preventDefault();act('add-player',{k:d.k});return;}
  if(!M||e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=(t.tagName||'').toLowerCase();
  if(e.key==='Escape'&&(ui.wk||ui.sub)){ui.wk=null;ui.sub=null;render();return;}
  if(tag==='input'||tag==='textarea'||tag==='select'||ui.wk||ui.sub||ui.tab!=='score') return;
  const S=analyse()[M.cur];
  if(!S.started||S.done) return;
  if(/^[0-6]$/.test(e.key)&&S.bowler!=null){
    const allow={n:[0,1,2,3,4,5,6],wd:[0,1,2,3,4],nb:[0,1,2,3,4,5,6],b:[1,2,3,4],lb:[1,2,3,4]}[ui.mode];
    if(allow.indexOf(+e.key)>=0) act('run',{r:e.key});
  }else if(e.key==='w'&&S.bowler!=null) act('wk-open',{});
  else if(e.key==='u') act('undo',{});
});

loadLib();loadHist();loadTours();
M=load();if(M&&String(M.savedAt||'')>LIVEAT){LIVEAT=M.savedAt;persistLive();}
/* A finished match is not reopened: it is kept in Match history and the app opens normally. Only a half-scored match is resumed. */
if(M){try{if(matchOutcome(M,analyse())){if(!M.recKey) histRecord(false);clearSaved();M=null;}}catch(e){}}
/* A half-scored match is always reopened where it was left, and sent to the spreadsheet again in case the last change did not get through. */
if(M) ui.view=M.cur;
render();
initDb();
syncStart(()=>syncSoon());
/* Leaving or closing the app never loses the match: pending saves are sent straight away, and anything that failed is retried when the connection returns. */
function flushNow(){
  if(liveT!==null){clearTimeout(liveT);liveT=null;liveWrite(()=>{if(!M) return null;REV++;return {json:JSON.stringify(M),rev:REV,by:DEVICE,at:new Date().toISOString()};});}
  if(SYNC.url&&syncT!==null){clearTimeout(syncT);syncT=null;syncPush(false,true);}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') flushNow();else pullState();});
setInterval(()=>{if(document.visibilityState==='visible') pullState();},8000);
window.addEventListener('pagehide',flushNow);
window.addEventListener('online',()=>{if(SYNC.url) syncPush(true);if(M) livePush();});
</script>
