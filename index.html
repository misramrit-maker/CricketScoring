<style>
/* Layout: scorebook column on phones; on tablets the scoring screen splits into board and crease on the left, keypad on the right. Players and teams are saved and picked from lists. */
:root{
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;

  --muted:#34585A;
  --line:#86C4B9;
  --accent:#0A605B;
  --accent-ink:#FFFFFF;
  --board:#0B3836;
  --board-ink:#EFFAF8;
  --board-muted:#9FCFCA;
  --board-line:#26605C;
  --wicket:#B3261E;
  --wicket-ink:#FFFFFF;
  --four:#1F5F8F;
  --six:#A15F00;
  --extra:#5A6878;
  --scrim:rgba(10,18,13,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{

}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.stack{max-width:760px;margin:0 auto}

.top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}

.over{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:4px 14px 12px;min-height:50px}

.key{min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-family:var(--font-display);font-size:32px;font-weight:700;cursor:pointer}

.btn.small{min-height:44px;padding:0 12px;font-size:14px}

.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:2px 12px 12px}

.pick .name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}

.ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}

.tick input{width:20px;height:20px;min-height:0;padding:0;flex:none;accent-color:var(--accent)}
.tick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}

.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;text-align:left}

.namebar{display:flex;gap:8px}
.namebar input{flex:1;min-width:0}
.arrowbtn{flex:none;width:48px;padding:0;display:grid;place-items:center}
.searchbox{margin:12px 0 8px}
.plist{display:grid;gap:6px;max-height:52vh;overflow:auto}
.prow{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 8px 6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.prow.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.prow .pn{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.addrow{display:flex;gap:8px;margin-top:10px}

.addrow .btn{flex:none}

.rowline .btn{flex:none}
.count{font-family:var(--font-data);font-size:13px;color:var(--muted)}
.empty{padding:14px;color:var(--muted);font-size:14px}
.squadline{font-size:13px;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere}
.tcard{padding:12px 14px;border-top:1px solid var(--line)}

.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* Toss */
.batwrap{perspective:700px;display:grid;place-items:center;padding:14px 0 6px;min-height:190px}

.batflip .rivers{transform:rotateY(180deg)}

@keyframes flipH{0%{transform:translateY(0) rotateY(0deg)}45%{transform:translateY(-44px) rotateY(900deg)}100%{transform:translateY(0) rotateY(1800deg)}}
@keyframes flipT{0%{transform:translateY(0) rotateY(0deg)}45%{transform:translateY(-44px) rotateY(900deg)}100%{transform:translateY(0) rotateY(1980deg)}}

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/*LOGIC_START*/
const OUT_CREDIT=['Bowled','Caught','LBW','Stumped','Hit wicket','Hit furniture','Six and out'];
const CUSTOM_HOWS=['Hit furniture','Six and out','Hit the ball twice','Obstructing the field','Handled the ball'];
function fmtOvers(b){return Math.floor(b/6)+'.'+(b%6);}
function rate(runs,balls){return balls?runs*6/balls:0;}

function chipFor(ev){
  const r=ev.r||0;
  let label,cls='';
  switch(ev.k){
    case 'wd':label='Wd'+(r?'+'+r:'');cls='x';break;
    case 'nb':label='Nb'+(r?'+'+r:'');cls='x';break;
    case 'b':label='B'+r;cls='x';break;
    case 'lb':label='Lb'+r;cls='x';break;
    default:label=r===0?'•':String(r);cls=r===4?'f':r===6?'s':'';
  }
  if(ev.w){label=(ev.k==='n'&&r===0)?'W':(ev.k==='n'?label+'W':label+'+W');cls='w';}
  return {l:label,c:cls};
}

/* Replays an innings' events into the full scoring state. Undo is just removing the last event. */
function compute(M,inn,target){
  const S={runs:0,wkts:0,balls:0,extras:{wd:0,nb:0,b:0,lb:0},bat:{},bowl:{},order:[],bowlOrder:[],fow:[],log:[],
    striker:null,non:null,bowler:null,lastBowler:null,thisOver:[],overDone:false,started:false,
    done:false,reason:'',target:target==null?null:target,curOverBowlerRuns:0};
  S.nBat=teamXi(M,inn.bat);
  if(!inn.openers) return S;
  S.started=true;
  const ensureBat=i=>{if(!S.bat[i]){S.bat[i]={idx:i,runs:0,balls:0,fours:0,sixes:0,out:false,how:'',by:null,f:null};S.order.push(i);}return S.bat[i];};
  const ensureBowl=i=>{if(!S.bowl[i]){S.bowl[i]={idx:i,balls:0,runs:0,maidens:0,wkts:0,wd:0,nb:0};S.bowlOrder.push(i);}return S.bowl[i];};
  S.striker=inn.openers[0];S.non=inn.openers[1];ensureBat(S.striker);ensureBat(S.non);
  for(const ev of inn.events){
    if(ev.t==='bowler'){
      if(S.bowler!=null){
        const cl=S.log[S.log.length-1];
        S.bowler=ev.id;ensureBowl(ev.id);
        if(cl&&cl.chips.length===0) cl.bowler=ev.id;else S.split=true;
        continue;
      }
      S.split=false;
      S.bowler=ev.id;ensureBowl(ev.id);
      if(S.overDone){S.thisOver=[];S.overDone=false;}
      S.curOverBowlerRuns=0;
      S.log.push({bowler:ev.id,chips:[],runs:0,wkts:0,score:S.runs,w:S.wkts});
      continue;
    }
    if(ev.t==='swap'){const t=S.striker;S.striker=S.non;S.non=t;continue;}
    if(S.bowler==null||S.striker==null) continue;
    const k=ev.k,r=ev.r||0;
    let total=0,batRuns=0,faced=false,bowlerRuns=0,legal=true;
    switch(k){
      case 'wd':total=1+r;bowlerRuns=1+r;legal=false;S.extras.wd+=1+r;break;
      case 'nb':total=1+r;batRuns=r;faced=true;bowlerRuns=1+r;legal=false;S.extras.nb+=1;break;
      case 'b':total=r;faced=true;S.extras.b+=r;break;
      case 'lb':total=r;faced=true;S.extras.lb+=r;break;
      default:total=r;batRuns=r;faced=true;bowlerRuns=r;
    }
    const st=S.bat[S.striker],bw=S.bowl[S.bowler];
    S.runs+=total;
    if(faced) st.balls++;
    st.runs+=batRuns;
    if(batRuns===4&&(k==='n'||k==='nb')) st.fours++;
    if(batRuns===6&&(k==='n'||k==='nb')) st.sixes++;
    bw.runs+=bowlerRuns;
    if(k==='wd') bw.wd++;
    if(k==='nb') bw.nb++;
    if(legal){S.balls++;bw.balls++;}
    S.curOverBowlerRuns+=bowlerRuns;
    if(ev.w){
      const w=ev.w,ob=S.bat[w.out];
      ob.out=true;ob.how=w.how;ob.f=w.f;
      const credit=OUT_CREDIT.indexOf(w.how)>=0;
      ob.by=credit?S.bowler:null;
      if(credit) bw.wkts++;
      S.wkts++;
      S.fow.push({w:S.wkts,score:S.runs,idx:w.out,ov:fmtOvers(S.balls)});
    }
    if(r%2===1){const t=S.striker;S.striker=S.non;S.non=t;}
    if(ev.w){
      if(S.striker===ev.w.out) S.striker=ev.w.next;
      else if(S.non===ev.w.out) S.non=ev.w.next;
      if(ev.w.next!=null) ensureBat(ev.w.next);
    }
    const chip=chipFor(ev);
    S.thisOver.push(chip);
    const lg=S.log[S.log.length-1];
    lg.chips.push(chip);lg.runs+=total;if(ev.w) lg.wkts++;lg.score=S.runs;lg.w=S.wkts;
    if(legal&&S.balls%6===0){
      if(S.curOverBowlerRuns===0&&!S.split) bw.maidens++;
      const t=S.striker;S.striker=S.non;S.non=t;
      S.lastBowler=S.bowler;S.bowler=null;S.overDone=true;
    }
  }
  S.bowlOrder=S.bowlOrder.filter(i=>S.bowl[i].balls>0||S.bowl[i].runs>0||i===S.bowler);
  S.allOut=S.wkts>=S.nBat-1;
  S.oversUp=!!M.overs&&S.balls>=M.overs*6;
  S.chased=S.target!=null&&S.runs>=S.target;
  S.declared=!!inn.declared;
  S.done=S.allOut||S.oversUp||S.chased||S.declared;
  S.reason=S.chased?'Target chased':S.allOut?'All out':S.oversUp?'Overs completed':S.declared?'Innings closed early':'';
  return S;
}

function teamXi(M,t){const x=M.teams[t];return Math.min(x.xi||x.players.length,x.players.length);}
function activeOf(M,t){const x=M.teams[t];return x.active||x.players.map((_,k)=>k).slice(0,teamXi(M,t));}
function nInnings(M){return M.nInn||2;}
function teamRuns(M,A,team,upto){let r=0;for(let i=0;i<upto&&i<A.length;i++) if(M.innings[i].bat===team) r+=A[i].runs;return r;}
function targetFor(M,A,i){
  if(i!==nInnings(M)-1) return null;
  const bat=M.innings[i].bat;
  return teamRuns(M,A,1-bat,i)-teamRuns(M,A,bat,i)+1;
}
function matchOutcome(M,A){
  const n=nInnings(M),pl=(k,w)=>k+' '+w+(k===1?'':'s'),name=t=>M.teams[t].name;
  if(M.drawn) return {win:null,drawn:true,text:'Match drawn'};
  const i=A.length-1,last=A[i];
  if(!last||!last.done) return null;
  const bat=M.innings[i].bat;
  if(i===n-1){
    const opp=teamRuns(M,A,1-bat,i),own=teamRuns(M,A,bat,i)+last.runs;
    if(own>opp) return {win:bat,text:name(bat)+' won by '+pl(last.nBat-1-last.wkts,'wicket')};
    if(own===opp) return {win:null,text:'Match tied'};
    return {win:1-bat,text:name(1-bat)+' won by '+pl(opp-own,'run')};
  }
  if(n===4&&i===2){
    const o=1-bat,oRuns=teamRuns(M,A,o,3),tRuns=teamRuns(M,A,bat,3)+last.runs;
    if(tRuns<oRuns) return {win:o,text:name(o)+' won by an innings and '+pl(oRuns-tRuns,'run')};
  }
  return null;
}

/* ---------- live match shared between devices ----------
   The match in progress is kept in one shared record. Every device writes to it after each change and
   follows it when another device changes it. If two devices score at the same instant the later write wins. */
const DEVICE=newId('d');
let REV=0,liveT=null,liveBusy=0;
function liveDirty(){return liveT!==null||liveBusy>0;}
function liveWrite(build){
  if(LIB.mode==='local') return;
  liveBusy++;
  remote(db=>{
    const p=build();
    return (p?db.doc('live/current').set(p):Promise.resolve()).then(()=>{liveBusy=Math.max(0,liveBusy-1);},e=>{liveBusy=Math.max(0,liveBusy-1);throw e;});
  });
}
function livePush(){
  if(LIB.mode==='local') return;
  clearTimeout(liveT);
  liveT=setTimeout(()=>{liveT=null;liveWrite(()=>{if(!M) return null;REV++;return {json:JSON.stringify(M),rev:REV,by:DEVICE,at:new Date().toISOString()};});},150);
}
function liveClear(){
  clearTimeout(liveT);liveT=null;
  liveWrite(()=>{REV++;return {cleared:true,rev:REV,by:DEVICE,at:new Date().toISOString()};});
}
function liveApply(x,first){
  if(x&&x.by===DEVICE) return;
  if(liveDirty()) return;
  if(!x){if(M) livePush();return;}
  if(x.cleared){
    if(typeof x.rev==='number'&&x.rev>REV) REV=x.rev;
    if(M){M=null;clearSaved();ui=freshUi();ui.top=true;if(!first) toast('The match was ended on another device');render();}
    return;
  }
  let m=null;try{m=JSON.parse(x.json);}catch(e){}
  if(!m||m.v!==1||!m.innings||!m.teams) return;
  const had=!!M,prevCur=M?M.cur:-1;
  M=m;if(typeof x.rev==='number'&&x.rev>REV) REV=x.rev;
  if(first){try{if(matchOutcome(M,analyse())){M=null;clearSaved();if(had) render();return;}}catch(e){}}
  try{localStorage.setItem(KEY,JSON.stringify(M));}catch(e){}
  if(!had){ui=freshUi();ui.view=M.cur;ui.top=true;}
  else if(M.cur!==prevCur){ui.view=M.cur;ui.wk=null;ui.sub=null;ui.chg=false;}
  else ui.view=Math.min(ui.view,M.cur);
  render();
}

function howText(inn,b){
  if(!b.out) return 'not out';
  const bw=b.by!=null?M.teams[inn.bowl].players[b.by]:'';
  const f=(b.f!=null&&b.f!=='')?M.teams[inn.bowl].players[b.f]:'';
  switch(b.how){
    case 'Bowled':return 'b '+bw;
    case 'LBW':return 'lbw b '+bw;
    case 'Caught':return f?(+b.f===b.by?'c & b '+bw:'c '+(M.teams[inn.bowl].wk===+b.f?'†':'')+f+' b '+bw):'caught b '+bw;
    case 'Stumped':return 'st '+(f||'†')+' b '+bw;
    case 'Run out':return 'run out'+(f?' ('+f+')':'');
    case 'Hit wicket':return 'hit wicket b '+bw;
    case 'Hit furniture':return 'hit furniture b '+bw;
    case 'Six and out':return 'six and out b '+bw;
  }
  return b.how;
}

  const id=ex?ex.id:newId('t');

    /* Starting a match picks up to 16 from the saved squad, so keep the whole saved squad and only add anyone new. */
    const full=ex.playerIds.filter(i=>libName(i)!=null);
    ids.forEach(i=>{if(full.indexOf(i)<0&&full.length<52) full.push(i);});
    const cp=ids.indexOf(p.cap)>=0?p.cap:(full.indexOf(ex.capId)>=0?ex.capId:''),wp=ids.indexOf(p.wk)>=0?p.wk:(full.indexOf(ex.wkId)>=0?ex.wkId:'');

  }else libPutTeam(id,name,ids,ids.indexOf(p.cap)>=0?p.cap:'',ids.indexOf(p.wk)>=0?p.wk:'');

/* ---------- tournaments ----------
   A tournament is a set of saved teams plus a schedule of fixtures that you build and order yourself.
   Playing a fixture opens the normal match setup for those two teams. When the match ends, its result
   is filed against the fixture and the running scores between teams update. */
const TOURKEY='cricketscorer.tours.v1';
const TT={IPL:'IPL Tournament',Custom:'Custom Overs Tournament',WTC:'World Test Championship'};
let TOURS=[];
function persistTours(){try{localStorage.setItem(TOURKEY,JSON.stringify(TOURS));}catch(e){}}
function loadTours(){try{const t=JSON.parse(localStorage.getItem(TOURKEY)||'null');if(Array.isArray(t)) TOURS=t.filter(x=>x&&x.id&&Array.isArray(x.teams)&&Array.isArray(x.fixtures));}catch(e){}}
function tourSave(T){
  const i=TOURS.findIndex(x=>x.id===T.id);if(i>=0) TOURS[i]=T;else TOURS.push(T);
  persistTours();syncSoon();const json=JSON.stringify(T);remote(db=>db.doc('tournaments/'+T.id).set({json:json}));
}
function tourDelete(id){TOURS=TOURS.filter(x=>x.id!==id);persistTours();syncSoon();remote(db=>db.doc('tournaments/'+id).delete());}
function curTour(){return TOURS.find(t=>t.id===ui.tourId)||null;}
function tName(T,id){const t=T.teams.find(x=>x.id===id);return t?t.name:'Team';}
function tourStages(T){return T.type==='WTC'?['Test','Final']:['League match','Qualifier 1','Eliminator','Qualifier 2','Semi-final','Final'];}
function tourFmt(T){return T.type==='IPL'?'IPL':T.type==='WTC'?'Test':'Custom';}
function fixInfo(fx){
  if(!fx) return null;
  const T=TOURS.find(x=>x.id===fx.tid),f=T&&T.fixtures.find(x=>x.id===fx.fid);
  return f?{T:T,f:f}:null;
}
function tourDesc(T){
  if(T.type==='IPL') return '20 overs a side, 16-player squads with an impact player.';
  if(T.type==='Custom') return T.overs+' overs a side.';
  return 'Test matches over four innings.';
}
function tlog(T,text){T.log=T.log||[];T.log.push({at:new Date().toISOString(),text:text});if(T.log.length>300) T.log.splice(0,T.log.length-300);}
function fmtDate(iso){try{const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}
const CATS=[['all','All matches'],['tour','Tournament match'],['reg','Regular match']];
function catBtns(act,cur){return '<div class="seg" style="margin-top:8px">'+CATS.map(c=>'<button class="opt" data-act="'+act+'" data-v="'+c[0]+'" aria-pressed="'+(cur===c[0])+'">'+c[1]+'</button>').join('')+'</div>';}
function catOk(r,f){return f==='tour'?!!r.tn:f==='reg'?!r.tn:true;}
function tourFinished(T){return T.finished===true||(T.fixtures.length>0&&T.fixtures.every(f=>f.done));}
function tourSummaryHtml(T){
  const pairs=tourPairs(T).filter(g=>g.played>0),played=T.fixtures.filter(f=>f.done).length;
  const rows=tourTable(T);
  const top=rows.length&&rows[0].w>0?'<div class="line"><b>Most wins</b> '+esc(rows[0].name)+' ('+plural(rows[0].w,'win')+')</div>':'';
  const live=T.fixtures.filter(f=>f.live&&!f.done).map(f=>esc(tName(T,f.a))+' v '+esc(tName(T,f.b))).join(', ');
  return (pairs.length?pairs.map(g=>{
      const extra=[g.ties?plural(g.ties,'tie'):'',g.draws?plural(g.draws,'draw'):''].filter(Boolean).join(', ');
      return '<div class="line"><b>'+esc(tName(T,g.a))+' '+g.wa+'&ndash;'+g.wb+' '+esc(tName(T,g.b))+'</b> <span class="muted">'+g.played+' of '+g.total+' played'+(extra?' &middot; '+extra:'')+'</span></div>';
    }).join(''):'<div class="line">No matches played yet.</div>')+
    (live?'<div class="line"><b>In progress</b> '+live+'</div>':'')+top+
    '<div class="line muted">'+played+' of '+plural(T.fixtures.length,'fixture')+' played</div>';
}
function genFixtures(T,rounds){
  const ids=T.teams.map(t=>t.id),out=[];
  if(T.type==='WTC'){
    for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) for(let k=1;k<=rounds;k++)
      out.push({id:newId('f'),a:ids[i],b:ids[j],label:'Test '+k+' of '+rounds,done:false,result:null});
  }else{
    for(let r=1;r<=rounds;r++) for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++)
      out.push({id:newId('f'),a:r%2?ids[i]:ids[j],b:r%2?ids[j]:ids[i],label:'League match'+(rounds>1?' (round '+r+')':''),done:false,result:null});
  }
  return out;
}
/* No points: each pair of teams just has a running score of wins, e.g. 3-1. */
function tourPairs(T){
  const map={},list=[];
  T.fixtures.forEach(f=>{
    const key=[f.a,f.b].sort().join('|');
    let g=map[key];
    if(!g){g={a:f.a,b:f.b,wa:0,wb:0,ties:0,draws:0,played:0,total:0,fx:[]};map[key]=g;list.push(g);}
    g.total++;g.fx.push(f);
    if(!f.done||!f.result) return;
    g.played++;
    const w=f.result.win;
    if(w==='tie') g.ties++;
    else if(w==='draw') g.draws++;
    else{const winner=w==='a'?f.a:f.b;if(winner===g.a) g.wa++;else g.wb++;}
  });
  return list;
}
function tourTable(T){
  const rows={};
  T.teams.forEach(t=>{rows[t.id]={id:t.id,name:t.name,p:0,w:0,l:0,t:0,d:0};});
  T.fixtures.forEach(f=>{
    if(!f.done||!f.result) return;
    const A=rows[f.a],B=rows[f.b];if(!A||!B) return;
    A.p++;B.p++;
    const w=f.result.win;
    if(w==='a'||w==='b'){const W=w==='a'?A:B,L=w==='a'?B:A;W.w++;L.l++;}
    else if(w==='tie'){A.t++;B.t++;}
    else{A.d++;B.d++;}
  });
  return Object.keys(rows).map(k=>rows[k]).sort((a,b)=>b.w-a.w||a.l-b.l||a.name.localeCompare(b.name));
}
/* Called when a match ends: files the result against its fixture. */
function tourRecord(A,out,rec){
  if(!M||!M.tour||!out) return;
  const T=TOURS.find(x=>x.id===M.tour.tid),f=T&&T.fixtures.find(x=>x.id===M.tour.fid);
  if(!f) return;
  const win=out.drawn?'draw':out.win===0?'a':out.win===1?'b':'tie';
  f.done=true;f.live=false;
  f.result={win:win,text:out.text,rec:M.recId,at:rec.at,toss:rec.toss,scores:rec.scores,summary:rec.summary};
  tlog(T,'Result: '+tName(T,f.a)+' v '+tName(T,f.b)+' ('+f.label+'): '+out.text);
  tourSave(T);
}
function tourAbandon(){
  if(!M||!M.tour||M.recKey) return;
  const T=TOURS.find(x=>x.id===M.tour.tid),f=T&&T.fixtures.find(x=>x.id===M.tour.fid);
  if(f&&f.live&&!f.done){f.live=false;tlog(T,'Match stopped before a result: '+tName(T,f.a)+' v '+tName(T,f.b));tourSave(T);}
}
/* If the last ball is undone so the match is no longer finished, the fixture goes back to being unplayed. */
function tourUndo(){
  if(!M||!M.tour) return;
  const T=TOURS.find(x=>x.id===M.tour.tid),f=T&&T.fixtures.find(x=>x.id===M.tour.fid);
  if(f&&f.done&&f.result&&f.result.rec===M.recId){f.done=false;f.live=true;f.result=null;tlog(T,'Result removed (last ball undone): '+tName(T,f.a)+' v '+tName(T,f.b));tourSave(T);}
}

function tourResultsHtml(T){

function actTour(a,d){
  const T=curTour();
  switch(a){
    case 'tour-type':ui.tnew.type=d.v;return true;
    case 'tour-create':{
      const n=ui.tnew,name=normName(n.name);
      if(!name){toast('Give the tournament a name');return false;}
      let overs=null;
      if(n.type==='Custom'){overs=parseInt(n.overs,10);if(!(overs>=1)){toast('Enter the overs per innings');return false;}overs=clamp(overs,1,90);}
      const t={id:newId('o'),name:name,type:n.type,overs:overs,teams:[],fixtures:[],at:new Date().toISOString()};
      tlog(t,'Tournament created: '+TT[t.type]);tourSave(t);ui.tourId=t.id;ui.tnew={name:'',type:n.type,overs:n.overs};ui.top=true;return true;}
    case 'tour-open':ui.tourId=d.id;ui.top=true;return true;
    case 'tour-finish':if(T){T.finished=true;tlog(T,'Tournament marked as finished');tourSave(T);}return true;
    case 'tour-reopen':if(T){T.finished=false;tlog(T,'Tournament reopened');tourSave(T);}return true;
    case 'tour-back':ui.tourId=null;ui.top=true;return true;
    case 'tour-del-arm':ui.armed='to'+d.id;return true;
    case 'tour-del':tourDelete(d.id);if(ui.tourId===d.id) ui.tourId=null;return true;
    case 'tm-open':if(!T) return false;ui.tm={kind:d.v,q:'',rounds:1,a:'',b:'',stage:tourStages(T)[0]};return true;
    case 'tm-close':ui.tm=null;return true;
    case 'tm-team-toggle':{
      if(!T) return false;
      const i=T.teams.findIndex(x=>x.id===d.id);
      if(i>=0){
        if(T.fixtures.some(f=>f.a===d.id||f.b===d.id)){toast('Remove that team\'s fixtures first');return false;}
        tlog(T,'Team removed: '+T.teams[i].name);T.teams.splice(i,1);
      }else{const lt=LIB.teams.find(x=>x.id===d.id);if(lt){T.teams.push({id:lt.id,name:lt.name});tlog(T,'Team added: '+lt.name);}}
      tourSave(T);
      const l=$('tmlist');if(l&&ui.tm) l.innerHTML=tmTeamsListHtml(T);
      return false;}
    case 'tm-team-remove':{
      if(!T) return false;
      if(T.fixtures.some(f=>f.a===d.id||f.b===d.id)){toast('Remove that team\'s fixtures first');return false;}
      tlog(T,'Team removed: '+tName(T,d.id));T.teams=T.teams.filter(x=>x.id!==d.id);tourSave(T);return true;}
    case 'sched-rounds':ui.tm.rounds=+d.v;return true;
    case 'sched-gen':{
      if(!T||T.teams.length<2) return false;
      const add=genFixtures(T,ui.tm.rounds);T.finished=false;T.fixtures=T.fixtures.concat(add);tlog(T,'Schedule added: '+plural(add.length,'fixture')+(T.type==='WTC'?' ('+plural(ui.tm.rounds,'Test')+' per series)':ui.tm.rounds===2?' (each team plays the others twice)':' (each team plays the others once)'));tourSave(T);
      toast('Added '+plural(add.length,'fixture'));return true;}
    case 'sched-add':{
      const m=ui.tm;
      if(!T||!m.a||!m.b){toast('Choose both teams');return false;}
      if(m.a===m.b){toast('Choose two different teams');return false;}
      T.finished=false;T.fixtures.push({id:newId('f'),a:m.a,b:m.b,label:m.stage||tourStages(T)[0],done:false,result:null});tlog(T,'Fixture added: '+tName(T,m.a)+' v '+tName(T,m.b)+' ('+(m.stage||tourStages(T)[0])+')');tourSave(T);
      toast(tName(T,m.a)+' v '+tName(T,m.b)+' added');return true;}
    case 'fix-play':{const f=T&&T.fixtures.find(x=>x.id===d.id);if(f) tourPlay(T,f);return true;}
    case 'fix-unlink':ui.setup.fixture=null;return true;
    case 'fix-move':{
      if(!T) return false;
      const i=+d.i,j=i+ +d.d;
      if(j>=0&&j<T.fixtures.length){const t=T.fixtures[i];T.fixtures[i]=T.fixtures[j];T.fixtures[j]=t;tourSave(T);}
      return true;}
    case 'fix-del':if(T){const f=T.fixtures.find(x=>x.id===d.id);if(f) tlog(T,'Fixture removed: '+tName(T,f.a)+' v '+tName(T,f.b)+' ('+f.label+')');T.fixtures=T.fixtures.filter(x=>x.id!==d.id);tourSave(T);}return true;
    case 'fix-clear-arm':ui.armed='fc';return true;
    case 'fix-clear':if(T){tlog(T,'Unplayed fixtures cleared');T.fixtures=T.fixtures.filter(x=>x.done);tourSave(T);}return true;
  }
  return null;
}

/* The toss is a bat with two sides. Internally 'heads' is Mountains and 'tails' is Rivers, which keeps older saved matches working. */

  const ridge=side==='heads';
  /* The ridged (triangular) back of the bat is Mountains. The flat face is Rivers. */
  const blade=ridge
    ?'<rect x="14" y="50" width="46" height="104" rx="9" fill="#E8C190" stroke="#8A5A1E" stroke-width="2"/><path d="M37 52 L58 152 L37 152 Z" fill="#F4D7AE" opacity=".9"/><path d="M37 52 L16 152 L37 152 Z" fill="#CFA06A" opacity=".9"/><line x1="37" y1="52" x2="37" y2="153" stroke="#8A5A1E" stroke-width="1.6"/><rect x="14" y="50" width="46" height="104" rx="9" fill="none" stroke="#8A5A1E" stroke-width="2"/>'
    :'<rect x="14" y="50" width="46" height="104" rx="9" fill="#E8C190" stroke="#8A5A1E" stroke-width="2"/><line x1="24" y1="70" x2="24" y2="140" stroke="#D2A66F" stroke-width="1"/><line x1="37" y1="62" x2="37" y2="146" stroke="#D2A66F" stroke-width="1"/><line x1="50" y1="70" x2="50" y2="140" stroke="#D2A66F" stroke-width="1"/>';
  return '<svg viewBox="0 0 74 158" aria-hidden="true"><rect x="31" y="2" width="12" height="52" rx="5" fill="#2B2118"/><rect x="31" y="14" width="12" height="2" fill="#5A4636"/><rect x="31" y="22" width="12" height="2" fill="#5A4636"/><rect x="31" y="30" width="12" height="2" fill="#5A4636"/>'+blade+'</svg>';
}

function tossHtml(){
  const s=ui.setup,flip=s.tossMode==='flip',c=s.coin;
  const mode=[['flip','Bat Flip'],['manual','Toss already done']].map(x=>'<button class="opt" data-act="toss-mode" data-v="'+x[0]+'" aria-pressed="'+(s.tossMode===x[0])+'">'+x[1]+'</button>').join('');
  let body='';
  if(flip){
    const callers=[0,1].map(i=>'<button class="opt" data-act="toss-caller" data-v="'+i+'" aria-pressed="'+(s.caller===String(i))+'">'+tnSpan(i)+'</button>').join('');
    const calls=['heads','tails'].map(x=>'<button class="opt" data-act="toss-call" data-v="'+x+'" aria-pressed="'+(s.call===x)+'">'+sideName(x)+'</button>').join('');
    const cls=c.state==='flipping'?'flip-'+c.result:c.state==='done'?'rest-'+c.result:'';
    body+='<div class="lab">Who calls</div><div class="opts">'+callers+'</div><div class="lab">The call</div><div class="opts">'+calls+'</div><p class="note">Mountains is the triangular ridged side of the bat. Rivers is the flat side.</p>'+
      '<div class="batwrap"><div class="batflip '+cls+'" role="img" aria-label="'+(c.state==='done'?'The bat landed on '+sideName(c.result):'Bat to flip')+'"><div class="face mountains">'+batFace('heads')+'</div><div class="face rivers">'+batFace('tails')+'</div></div></div>'+
      '<div class="tossresult">'+(c.state==='done'?'<p class="big">'+sideName(c.result)+'</p><p>'+tnSpan(+s.caller)+' called '+sideName(s.call)+'. <b>'+tnSpan(+s.winner)+'</b> won the toss.</p>':c.state==='flipping'?'<p class="muted">Flipping...</p>':'<p class="muted">Tap Flip bat to toss.</p>')+'</div>'+
      '<div class="actions" style="justify-content:center"><button class="btn primary" data-act="toss-flip"'+(c.state==='flipping'?' disabled':'')+'>'+(c.state==='done'?'Flip again':'Flip bat')+'</button></div>';
  }else{
    body+='<div class="lab">Toss won by</div><div class="opts">'+[0,1].map(i=>'<button class="opt" data-act="toss-winner" data-v="'+i+'" aria-pressed="'+(s.winner===String(i))+'">'+tnSpan(i)+'</button>').join('')+'</div>';

    '<section class="panel"><h3>Saved teams <em>'+LIB.teams.length+'</em></h3>'+(teams||'<div class="empty">No teams saved yet.</div>')+'</section>'+
    '</div></div></div>';
}
function startMatch(){
  const s=ui.setup;
  const test=s.fmt==='Test';
  let overs=null;
  if(!test){
    overs=parseInt(s.overs,10);
    if(!(overs>=1)){toast(s.fmt==='Custom'?'Enter the number of overs for this match':'Enter the overs per innings');return false;}
    overs=clamp(overs,1,90);
  }
  const teams=[];
  for(let k=0;k<2;k++){
    const p=s.slots[k];
    const name=normName(p.name)||('Team '+'AB'[k]);
    const ids=p.sel.filter(id=>libName(id)!=null);
    if(ids.length<2){toast(name+' needs at least 2 players');return false;}
    if(s.fmt==='IPL'&&ids.length!==16){toast('IPL needs all 16 players for '+name+' (11 plus 5 substitutes). You have '+ids.length+'.');return false;}
    if(ids.length>16){toast(name+' can have at most 16 players in a match. Remove '+(ids.length-16)+' to continue.');return false;}
    if(ids.indexOf(p.cap)<0){toast('Choose a captain for '+name);return false;}
    if(ids.indexOf(p.wk)<0){toast('Choose a wicketkeeper for '+name);return false;}
    const xi=Math.min(11,ids.length);
    const ci=ids.indexOf(p.cap),wi=ids.indexOf(p.wk);
    teams.push({name:name,players:ids.map(libName),xi:xi,active:Array.from({length:xi},(_,k)=>k),gone:[],cap:ci>=0?ci:null,wk:wi>=0?wi:null});
  }
  if(teams[0].name.toLowerCase()===teams[1].name.toLowerCase()){toast('The two teams need different names');return false;}
  const minSize=Math.min(teams[0].xi,teams[1].xi);
  let maxPer=null;
  if(!test){
    const userMax=parseInt(s.maxper,10);
    const base=userMax>0?userMax:defaultMaxPer(s.fmt,overs);
    maxPer=Math.max(base,Math.ceil(overs/(minSize-1)));
  }
  const fi=s.fixture?fixInfo(s.fixture):null;
  if(fi&&(s.slots[0].teamId!==fi.f.a||s.slots[1].teamId!==fi.f.b)){toast('This is a tournament match. Team A must be '+tName(fi.T,fi.f.a)+' and Team B '+tName(fi.T,fi.f.b)+'.');return false;}
  if(s.winner===''||!s.choice){toast('Do the toss first, then choose bat or bowl');return false;}
  const winner=+s.winner,choice=s.choice;
  const bat=choice==='bat'?winner:1-winner;
  saveTeam('0',true);saveTeam('1',true);
  M={v:1,tour:fi?{tid:fi.T.id,fid:fi.f.id,label:fi.T.name+' · '+fi.f.label}:null,format:s.fmt,maxSubs:s.fmt==='IPL'?1:null,subsLog:[],nInn:test?4:2,overs:overs,maxPer:maxPer,teams:teams,toss:{winner:winner,choice:choice,mode:s.tossMode,caller:+s.caller,call:s.call,result:s.tossMode==='flip'?s.coin.result:null},
     innings:[{bat:bat,bowl:1-bat,openers:null,events:[],declared:false}],cur:0};
  if(fi){fi.f.live=true;tlog(fi.T,'Match started: '+tName(fi.T,fi.f.a)+' v '+tName(fi.T,fi.f.b)+' ('+fi.f.label+')');tourSave(fi.T);}
  return true;
}

/* actions on the setup and squads screens; returns true when the screen should redraw */
function actLib(a,d){
  switch(a){
    case 'screen':ui.screen=d.v;ui.top=true;return true;
    case 'tour-type':case 'tour-create':case 'tour-open':case 'tour-finish':case 'tour-reopen':case 'tour-back':case 'tour-del-arm':case 'tour-del':case 'tm-open':case 'tm-close':case 'tm-team-toggle':case 'tm-team-remove':case 'sched-rounds':case 'sched-gen':case 'sched-add':case 'fix-play':case 'fix-unlink':case 'fix-move':case 'fix-del':case 'fix-clear-arm':case 'fix-clear':return actTour(a,d)===true;
    case 'preset':ui.setup.overs=String(d.v);ui.setup.fmt=d.v==='20'?'T20':d.v==='50'?'ODI':'Custom';return true;
    case 'format':{const s=ui.setup;if(s.fixture) return false;s.fmt=d.v;s.maxper='';if(d.v==='T20'||d.v==='IPL') s.overs='20';else if(d.v==='ODI') s.overs='50';else if(d.v==='Custom') s.overs='';return true;}
    case 'add-player':addPlayerTo(d.k);return true;
    case 'pick-open':ui.pickK=d.k;ui.pickQ='';return true;
    case 'team-open':ui.teamK=d.k;ui.teamQ='';return true;
    case 'team-close':ui.teamK=null;return true;
    case 'team-add':pickTeam(d.k,d.id);ui.teamK=null;return true;
    case 'pick-close':ui.pickK=null;return true;
    case 'pick-toggle':{
      const p=pk(d.k),i=p.sel.indexOf(d.id);
      if(i>=0) p.sel.splice(i,1);
      else if(otherSel(d.k).indexOf(d.id)>=0) return false;
      else if(p.sel.length>=maxSel(d.k)){toast('Up to '+maxSel(d.k)+' players can be selected here');return false;}
      else p.sel.push(d.id);
      const pl=$('plist');if(pl) pl.innerHTML=pickListHtml(d.k);
      const pc=$('pcount');if(pc) pc.textContent=p.sel.length+' of '+maxSel(d.k)+(iplSquad(d.k)?' needed':' selected')+(p.sel.length>=maxSel(d.k)?' (full)':'');
      return false;}
    case 'save-team':saveTeam(d.k,false);return true;
    case 'clear-editor':ui.squads.editor={teamId:'',name:'',sel:[],newp:''};ui.focus='tn-e';return true;
    case 'copy-team':{
      const t=LIB.teams.find(x=>x.id===d.id);if(!t) return true;
      const base=t.name.replace(/ \(copy( \d+)?\)$/,'').slice(0,28);
      let name=base+' (copy)',n=2;
      while(LIB.teams.some(x=>x.name.toLowerCase()===name.toLowerCase())) name=base+' (copy '+(n++)+')';
      const id=newId('t'),ids=t.playerIds.filter(i=>libName(i)!=null);
      libPutTeam(id,name,ids,t.capId,t.wkId);
      ui.squads.editor={teamId:id,name:name,sel:ids.slice(),newp:'',cap:t.capId||'',wk:t.wkId||''};
      ui.focus='tn-e';ui.top=true;toast('Copied as "'+name+'". Edit it below.');return true;}
    case 'edit-team':{const t=LIB.teams.find(x=>x.id===d.id);if(t){ui.squads.editor={teamId:t.id,name:t.name,sel:t.playerIds.filter(i=>libName(i)!=null),newp:'',cap:t.capId||'',wk:t.wkId||''};ui.focus='tn-e';}return true;}
    case 'del-player-arm':ui.armed='dp'+d.id;return true;
    case 'del-player':libDelPlayer(d.id);return true;
    case 'del-team-arm':ui.armed='dt'+d.id;return true;
    case 'del-team':libDelTeam(d.id);if(ui.squads.editor.teamId===d.id) ui.squads.editor={teamId:'',name:'',sel:[],newp:''};return true;
    case 'unpick':{const p=pk(d.k),i=p.sel.indexOf(d.id);if(i>=0) p.sel.splice(i,1);return true;}
    case 'move':{const p=pk(d.k),i=+d.i,j=i+ +d.d;if(j>=0&&j<p.sel.length){const t=p.sel[i];p.sel[i]=p.sel[j];p.sel[j]=t;}return true;}
    case 'toss-mode':ui.setup.tossMode=d.v;resetToss();return true;
    case 'toss-caller':ui.setup.caller=d.v;resetToss();return true;
    case 'toss-call':ui.setup.call=d.v;resetToss();return true;
    case 'toss-winner':ui.setup.winner=d.v;ui.setup.choice='';return true;
    case 'toss-choice':ui.setup.choice=d.v;return true;
    case 'toss-flip':{
      const s=ui.setup;if(s.coin.state==='flipping') return false;
      let bit;
      try{const arr=new Uint32Array(1);window.crypto.getRandomValues(arr);bit=arr[0]&1;}catch(e){bit=Math.random()<.5?1:0;}
      const result=bit?'tails':'heads';
      s.coin={state:'flipping',result:result};s.winner='';s.choice='';
      let ms=1500;try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) ms=250;}catch(e){}
      setTimeout(()=>{
        if(!M&&ui.setup===s&&s.coin.state==='flipping'&&s.coin.result===result){
          s.coin.state='done';s.winner=(s.call===result)?s.caller:String(1-(+s.caller));render();
        }
      },ms);
      return true;}
    case 'start':if(!startMatch()) return false;ui=freshUi();ui.top=true;save();return true;
  }
  return false;
}

function subModal(A){
  const S=A[M.cur],inn=cur(),sub=ui.sub,t=sub.team,tm=M.teams[t];

  const used=(M.subsLog||[]).filter(x=>x.team===t).length;

  const busy=S.done?[]:(t===inn.bat?[S.striker,S.non]:[]).concat(t===inn.bowl&&S.bowler!=null?[S.bowler]:[]);
  const offOpts=act.filter(i=>busy.indexOf(i)<0);

  const sel=(opts,key)=>'<select data-subbind="'+key+'"><option value="">Choose a player</option>'+opts.map(i=>'<option value="'+i+'"'+(String(sub[key])===String(i)?' selected':'')+'>'+esc(tm.players[i])+'</option>').join('')+'</select>';
  const teamBtns=[0,1].map(i=>'<button class="opt" data-act="sub-team" data-v="'+i+'" aria-pressed="'+(t===i)+'">'+esc(M.teams[i].name)+'</button>').join('');
  const last=(M.subsLog||[])[(M.subsLog||[]).length-1];

/* One innings as batting and bowling tables. Used for the live scorecard and for saved matches in Match history. */
function cardPanels(d){

    '<div class="tbl-wrap"><table><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (d.dnb.length?'<div class="line"><b>Did not bat</b> '+d.dnb.map(esc).join(', ')+'</div>':'')+(d.subs.length?'<div class="line"><b>Substitutes</b> '+d.subs.map(esc).join(', ')+'</div>':'')+
    '<div class="line"><b>Extras '+exT+'</b> (b '+ex.b+', lb '+ex.lb+', wd '+ex.wd+', nb '+ex.nb+')</div>'+
    '<div class="line"><b>Total '+d.runs+'/'+d.wkts+'</b> in '+fmtOvers(d.balls)+' overs, run rate '+rate(d.runs,d.balls).toFixed(2)+'</div>'+
    '<div class="line"><b>Boundaries</b> '+plural(fours,'four')+', '+plural(sixes,'six')+' off the bat</div>'+
    (d.fow.length?'<div class="line"><b>Fall of wickets</b> '+d.fow.map(esc).join(', ')+'</div>':'')+'</section>'+
    '<section class="panel"><h3>'+esc(d.bowl)+' bowling <em>overs-maidens-runs-wickets</em></h3><div class="tbl-wrap"><table><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Wd</th><th>Nb</th><th>Econ</th></tr></thead><tbody>'+
    (brows||'<tr><td colspan="8" class="muted">No overs bowled yet</td></tr>')+'</tbody></table></div></section>';
}
function tossPanel(text){return text?'<section class="panel"><h3>Toss</h3><div class="line" style="border-top:0"><b>'+esc(text)+'.</b></div></section>':'';}
function cardTab(A){

  if(!S.started) return viewToggle(A)+tossPanel(tossText())+'<div class="panel pad"><p class="muted">This innings has not started.</p></div>';

function oversTab(A){

    '<div class="over">'+(o.chips.length?chipsHtml(o.chips):'<span class="none">Not started</span>')+'</div></section>').reverse().join('');

function summaryText(A){
  const lines=[];
  A.forEach((S,i)=>{
    const inn=M.innings[i],bt=M.teams[inn.bat].players;

  if(r) lines.push('',r.text);
  return lines.join('\n');

function formatText(){
  if(!M.overs) return 'Test match · '+nInnings(M)+' innings · no over limit · no limit on overs per bowler';
  return (M.format&&M.format!=='Custom'?M.format+' · ':'')+M.overs+' overs per innings · '+(M.maxPer?'max '+M.maxPer+' overs per bowler':'no limit on overs per bowler')+(M.maxSubs?' · '+M.maxSubs+' impact player per team':'');
}
function tossText(){

  if(t.mode==='flip'&&t.result) s=M.teams[t.caller].name+' called '+sideName(t.call)+'. It landed on '+sideName(t.result)+'. ';
  return s+M.teams[t.winner].name+' won the toss and chose to '+t.choice+' first';

function matchTab(A){

    '<div class="actions"><button class="btn primary" data-act="copy">Copy summary</button>'+(nInnings(M)===4&&!r?'<button class="btn'+(ui.armed==='draw'?' armed':' danger')+'" data-act="'+(ui.armed==='draw'?'draw-confirm':'draw-arm')+'">'+(ui.armed==='draw'?'Tap again to declare a draw':'Declare a draw')+'</button>':'')+
    '<button class="btn'+(ui.armed==='new'?' armed':' danger')+'" data-act="'+(ui.armed==='new'?'new-confirm':'new-arm')+'">'+(ui.armed==='new'?'Tap again to discard this match':'New match')+'</button></div>'+

/* ---------- match actions ---------- */
function pushBall(k,r,w){
  const S=analyse()[M.cur];
  if(!S.started||S.done||S.bowler==null) return;
  cur().events.push({t:'ball',k:k,r:r,w:w||null});
}
function act(a,d){
  if(['end-arm','new-arm','draw-arm','del-player-arm','del-team-arm','hist-del-arm','hist-del','menu'].indexOf(a)<0) ui.armed=null;
  if(a!=='copy') ui.copyText=null;
  if(histAct(a,d)) return;
  if(!M){
    if(actLib(a,d)||a==='start') render();
    return;
  }
  const inn=cur();
  switch(a){
    case 'tab':ui.tab=d.v;ui.top=true;if(d.v==='card'||d.v==='overs') ui.view=Math.min(ui.view,M.innings.length-1);break;
    case 'view':ui.view=+d.v;break;
    case 'mode':ui.mode=d.v;break;
    case 'run':pushBall(ui.mode,+d.r,null);ui.mode='n';break;
    case 'wk-open':{
      const hows={n:6,wd:3,nb:1,b:1,lb:1}[ui.mode];
      ui.wk={mode:ui.mode,how:hows===1?'Run out':null,who:'s',r:0,f:'',next:null};break;}
    case 'wk-how':ui.wk.how=d.v;ui.wk.f='';break;
    case 'wk-who':ui.wk.who=d.v;break;
    case 'wk-runs':ui.wk.r=+d.v;break;
    case 'wk-cancel':ui.wk=null;break;
    case 'wk-confirm':{
      const S=analyse()[M.cur],wk=ui.wk;
      if(!wk||!wk.how) break;
      const outIdx=(wk.how==='Run out'&&wk.who==='n')?S.non:S.striker;
      const last=S.wkts+1>=S.nBat-1;
      const next=last?null:(wk.next!=null?wk.next:firstUnbatted(S,cur().bat));
      let f=(wk.f!==''&&wk.f!=null)?+wk.f:null,how=wk.how;
      if(how==='Caught & bowled'){how='Caught';f=S.bowler;}
      else if(how==='Caught behind'){
        how='Caught';
        const kp=M.teams[cur().bowl].wk;
        if(kp!=null&&activeOf(M,cur().bowl).indexOf(kp)>=0) f=kp;
      }
      pushBall(wk.mode,how==='Run out'?wk.r:0,{how:how,out:outIdx,f:f,next:next});
      ui.wk=null;ui.mode='n';break;}
    case 'undo':
      M.impactChoice=[null,null];
      if(M.drawn) M.drawn=false;
      else if(inn.declared) inn.declared=false;
      else if(inn.events.length) inn.events.pop();
      else if(inn.openers) inn.openers=null;
      ui.mode='n';ui.chg=false;break;
    case 'swap':if(analyse()[M.cur].bowler!=null) inn.events.push({t:'swap'});break;
    case 'bowler':inn.events.push({t:'bowler',id:+d.i});ui.chg=false;break;
    case 'chg-bowler':ui.chg=true;break;
    case 'chg-cancel':ui.chg=false;break;
    case 'start-inn':{
      const s=+$('sel-s').value,n=+$('sel-n').value,b=+$('sel-b').value;
      if(s===n){toast('Pick two different batters');return;}
      inn.openers=[s,n];inn.events.push({t:'bowler',id:b});break;}
    case 'next-inn':
      if(M.format==='IPL'&&M.cur===0&&!(impactStatus(0)&&impactStatus(1))) break;
      goNextInnings();break;
    case 'sub-open':if(M.format!=='IPL') break;ui.sub={team:inn.bat,out:'',in:''};break;
    case 'sub-team':ui.sub.team=+d.v;ui.sub.out='';ui.sub.in='';break;
    case 'sub-cancel':ui.sub=null;break;
    case 'sub-confirm':{
      const sub=ui.sub;if(!sub||sub.out===''||sub.in==='') break;
      const tm=M.teams[sub.team];
      if(M.maxSubs!=null&&(M.subsLog||[]).filter(x=>x.team===sub.team).length>=M.maxSubs) break;
      if(!tm.active) tm.active=activeOf(M,sub.team);
      tm.gone=tm.gone||[];
      const pos=tm.active.indexOf(sub.out);if(pos<0) break;
      tm.active[pos]=sub.in;tm.gone.push(sub.out);
      M.subsLog=M.subsLog||[];M.subsLog.push({team:sub.team,out:sub.out,in:sub.in,inn:M.cur,balls:analyse()[M.cur].balls});
      toast(tm.players[sub.in]+' replaces '+tm.players[sub.out]);
      const brk=sub.brk;ui.sub=null;if(brk) maybeAdvance();break;}
    case 'impact-open':ui.sub={team:+d.t,out:'',in:'',lock:true,brk:true};break;
    case 'impact-none':M.impactChoice=M.impactChoice||[null,null];M.impactChoice[+d.t]='none';maybeAdvance();break;
    case 'impact-change':M.impactChoice=M.impactChoice||[null,null];M.impactChoice[+d.t]=null;break;
    case 'impact-undo':{
      const L=M.subsLog||[];let ix=-1;
      for(let k=L.length-1;k>=0;k--) if(L[k].team===+d.t){ix=k;break;}
      if(ix>=0){const e=L.splice(ix,1)[0],tm=M.teams[e.team],pos=tm.active.indexOf(e['in']);if(pos>=0) tm.active[pos]=e.out;tm.gone=(tm.gone||[]).filter(x=>x!==e.out);}
      break;}
    case 'sub-undo':{
      const e=(M.subsLog||[]).pop();if(!e) break;
      const tm=M.teams[e.team],pos=tm.active.indexOf(e['in']);
      if(pos>=0) tm.active[pos]=e.out;
      tm.gone=(tm.gone||[]).filter(x=>x!==e.out);
      ui.sub={team:e.team,out:'',in:''};break;}
    case 'draw-arm':ui.armed='draw';break;
    case 'draw-confirm':M.drawn=true;break;
    case 'back-inn':
      if(M.cur>0&&!M.innings[M.cur].events.length&&!M.innings[M.cur].openers){M.innings.pop();M.cur--;ui.view=M.cur;}break;
    case 'end-arm':ui.armed='end';break;
    case 'end-confirm':inn.declared=true;break;
    case 'new-arm':ui.armed='new';break;
    case 'new-confirm':if(!M.recKey&&M.innings.some(x=>x.events.length)) histRecord(true);tourAbandon();clearSaved();M=null;liveClear();ui=freshUi();ui.top=true;render();return;
    case 'copy':{
      const text=summaryText(analyse());
      const fallback=()=>{ui.copyText=text;render();};
      try{navigator.clipboard.writeText(text).then(()=>toast('Summary copied'),fallback);}catch(e){fallback();}
      return;}
  }
  {const r=matchOutcome(M,analyse());if(r){const k=r.text;if(M.recKey!==k){M.recKey=k;histRecord(false);}}else if(M.recKey){M.recKey=null;tourUndo();}}
  save();render();
}

function render(){
  const ae=document.activeElement;
  const fid=(ae&&ae.id&&$('app').contains(ae))?ae.id:null;
  let ss=null,se=null;
  try{ss=ae.selectionStart;se=ae.selectionEnd;}catch(e){}
  const sy=window.scrollY;
  $('app').innerHTML=(ui.hist?histHtml():M?renderMatch():renderSetup())+((!M&&!ui.hist&&ui.pickK!=null)?pickModal():'')+((!M&&!ui.hist&&ui.teamK!=null)?teamModal():'')+((!M&&!ui.hist&&ui.tm)?tourModal():'');
  const want=ui.focus||fid;
  if(want){
    const el=$(want);
    if(el){
      try{el.focus({preventScroll:true});}catch(e){}
      if(want===fid&&!ui.focus&&ss!=null){try{el.setSelectionRange(ss,se);}catch(e){}}
    }
  }
  ui.focus=null;
  window.scrollTo(0,ui.top?0:sy);ui.top=false;
  const cb=$('copybox');if(cb){cb.focus();cb.select();}
}

document.addEventListener('click',e=>{
  if(ui.menu&&!e.target.closest('.menuwrap')){ui.menu=false;if(!e.target.closest('[data-act]')){render();return;}}
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled) return;
  if(el.dataset.act==='wk-cancel-bg'){if(e.target===el){ui.wk=null;render();}return;}
  if(el.dataset.act==='tm-close-bg'){if(e.target===el){ui.tm=null;render();}return;}
  if(el.dataset.act==='team-close-bg'){if(e.target===el){ui.teamK=null;render();}return;}
  if(el.dataset.act==='pick-close-bg'){if(e.target===el){ui.pickK=null;render();}return;}
  if(el.dataset.act==='sub-cancel-bg'){if(e.target===el){ui.sub=null;render();}return;}
  act(el.dataset.act,el.dataset);
});
function updateToss(){document.querySelectorAll('[data-tn]').forEach(el=>{el.textContent=tn(+el.dataset.tn);});}
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.f==='sync'){SYNC.url=e.target.value.trim();persistSync();return;}
  if(e.target.dataset&&e.target.dataset.f==='psearch'){ui.pickQ=e.target.value;const l=$('plist');if(l&&ui.pickK!=null) l.innerHTML=pickListHtml(ui.pickK);return;}
  if(e.target.dataset&&e.target.dataset.f==='tmsearch'){if(ui.tm){ui.tm.q=e.target.value;const T=curTour(),l=$('tmlist');if(T&&l) l.innerHTML=tmTeamsListHtml(T);}return;}
  if(e.target.dataset&&e.target.dataset.f==='tsearch'){ui.teamQ=e.target.value;const l=$('tlist');if(l&&ui.teamK!=null) l.innerHTML=teamListHtml(ui.teamK);return;}
  if(M) return;
  const t=e.target,d=t.dataset||{};
  if(d.s){ui.setup[d.s]=t.value;return;}
  if(d.f==='tname'){ui.tnew.name=t.value;return;}
  if(d.f==='tovers'){ui.tnew.overs=t.value;return;}
  if(d.f==='name'){pk(d.k).name=t.value;updateToss();}
  else if(d.f==='newp'){if(d.k==='lib') ui.squads.newp=t.value;else pk(d.k).newp=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(!M){
    if(d.s){ui.setup[d.s]=t.value;if(d.s==='overs'){const f=ui.setup.fmt;if(f!=='Custom'){ui.setup.fmt=((f==='IPL'||f==='T20')&&t.value==='20')?f:t.value==='20'?'T20':t.value==='50'?'ODI':'Custom';}render();}return;}
    if(d.f&&d.f.indexOf('tm-')===0&&ui.tm){ui.tm[d.f.slice(3)]=t.value;return;}
    if(d.f==='team'){pickTeam(d.k,t.value);render();}
    else if(d.f==='cap'||d.f==='wkp'){const p=pk(d.k);if(d.f==='cap') p.cap=t.value;else p.wk=t.value;}
    else if(d.f==='tick'){
      const p=pk(d.k),i=p.sel.indexOf(d.id);
      if(t.checked&&i<0&&otherSel(d.k).indexOf(d.id)<0){if(p.sel.length>=maxSel(d.k)) toast('Up to '+maxSel(d.k)+' players can be selected here');else p.sel.push(d.id);}
      else if(!t.checked&&i>=0) p.sel.splice(i,1);
      render();
    }else if(d.f==='rename'){
      const name=normName(t.value),cur=LIB.players.find(p=>p.id===d.id);
      if(cur&&name&&name!==cur.name){
        if(LIB.players.some(p=>p.id!==d.id&&p.name.toLowerCase()===name.toLowerCase())) toast(name+' is already saved');
        else libPutPlayer(d.id,name);
      }
      render();
    }
    return;
  }
  if(d.bind&&ui.wk){ui.wk[d.bind]=t.value===''?'':+t.value;}
  if(d.subbind&&ui.sub){ui.sub[d.subbind]=t.value===''?'':+t.value;render();}
});
document.addEventListener('keydown',e=>{
  const t=e.target,d=t.dataset||{};
  if(!M&&e.key==='Escape'&&(ui.pickK!=null||ui.teamK!=null||ui.tm)){ui.pickK=null;ui.teamK=null;ui.tm=null;render();return;}
  if(!M&&d.f==='newp'&&e.key==='Enter'){e.preventDefault();act('add-player',{k:d.k});return;}
  if(!M||e.metaKey||e.ctrlKey||e.altKey) return;
  const tag=(t.tagName||'').toLowerCase();
  if(e.key==='Escape'&&(ui.wk||ui.sub)){ui.wk=null;ui.sub=null;render();return;}
  if(tag==='input'||tag==='textarea'||tag==='select'||ui.wk||ui.sub||ui.tab!=='score') return;
  const S=analyse()[M.cur];
  if(!S.started||S.done) return;
  if(/^[0-6]$/.test(e.key)&&S.bowler!=null){
    const allow={n:[0,1,2,3,4,5,6],wd:[0,1,2,3,4],nb:[0,1,2,3,4,5,6],b:[1,2,3,4],lb:[1,2,3,4]}[ui.mode];
    if(allow.indexOf(+e.key)>=0) act('run',{r:e.key});
  }else if(e.key==='w'&&S.bowler!=null) act('wk-open',{});
  else if(e.key==='u') act('undo',{});
});

loadLib();loadHist();loadTours();
M=load();
/* A finished match is not reopened: it is kept in Match history and the app opens normally. Only a half-scored match is resumed. */
if(M){try{if(matchOutcome(M,analyse())){if(!M.recKey) histRecord(false);clearSaved();M=null;}}catch(e){}}
/* A half-scored match is only reopened when everything entered so far had reached the spreadsheet. */
if(M){let ok=false;try{ok=!!SYNC.url&&localStorage.getItem(SYNCEDKEY)===sigHash(buildSync().sig);}catch(e){}if(!ok) M=null;}
if(M) ui.view=M.cur;
render();
initDb();
</script>
